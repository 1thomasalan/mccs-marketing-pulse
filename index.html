<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root{--txt:#eef1f6;--mut:rgba(238,241,246,.58);--line:rgba(255,255,255,.12);--glow:#f3d9a4;--card:rgba(255,255,255,.055);--fb:#8fb4ff;--ig:#f3a6b8;
--sky:radial-gradient(120% 80% at 50% 110%,#c98f6b 0%,#6d5a7a 28%,#2b3352 55%,#0e1420 85%);--serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body[data-theme=dawn]{--sky:radial-gradient(120% 80% at 50% 110%,#ffd3a5 0%,#f2a7a0 26%,#8f8bc6 56%,#34416e 92%);--glow:#fff1d6}
body[data-theme=ocean]{--sky:radial-gradient(120% 80% at 50% 110%,#6fd6d6 0%,#2b7a9e 28%,#173a5e 58%,#07142a 90%);--glow:#c8f6f2}
body[data-theme=forest]{--sky:radial-gradient(120% 80% at 50% 110%,#b9cc8c 0%,#55806a 28%,#1f3b33 58%,#0a1613 90%);--glow:#e6f2c4}
body[data-theme=midnight]{--sky:radial-gradient(120% 80% at 50% 110%,#1b2131 0%,#090b11 50%,#000 85%);--glow:#cfd8ec}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--txt);font-family:var(--sans);background:#0e1420;min-height:100%}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.sky{position:fixed;inset:0;background:var(--sky);z-index:0}
.wrap{position:relative;z-index:1}
.sky::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.06) 0 1px,transparent 2px) 0 0/90px 90px,radial-gradient(circle at 70% 40%,rgba(255,255,255,.05) 0 1px,transparent 2px) 0 0/130px 130px}
.wrap{max-width:1180px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) clamp(16px,4vw,36px) calc(env(safe-area-inset-bottom) + 110px)}
.top{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--mut)}
.top .icon{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:var(--card);backdrop-filter:blur(8px)}
.icon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hero{text-align:center;margin:4vh 0 3vh}
.hero h1{font-family:var(--serif);font-weight:400;font-style:italic;font-size:clamp(17px,4vw,22px);color:var(--mut);margin:0}
.big{font-family:var(--sans);font-weight:200;font-size:clamp(64px,17vw,124px);letter-spacing:-1px;line-height:1.05;margin:6px 0 2px;text-shadow:0 0 60px color-mix(in srgb,var(--glow) 40%,transparent)}
.sub{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--mut)}
.delta{display:inline-block;margin-top:10px;padding:5px 12px;border-radius:999px;font-size:13px;border:1px solid var(--line)}
.up{color:#9ee6b4}.down{color:#ffb0a8}
.range{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:18px 0 6px}
.range button,.chip{padding:9px 15px;border-radius:999px;border:1px solid var(--line);font-size:14px;color:var(--mut);backdrop-filter:blur(6px);background:rgba(255,255,255,.03)}
.range button.on,.chip.on{border-color:var(--glow);color:var(--txt);background:color-mix(in srgb,var(--glow) 13%,transparent)}
.rlabel{text-align:center;font-family:var(--serif);font-size:17px;margin-top:8px}
.rlabel small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);margin-top:4px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(2,1fr);margin-top:26px}
@media(min-width:820px){.grid{grid-template-columns:repeat(4,1fr)}.cols{grid-template-columns:1.6fr 1fr!important}}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.kpi .l{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--mut)}
.kpi .v{font-weight:250;font-size:clamp(30px,7vw,40px);margin:8px 0 4px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12.5px}
.kpi .s{font-size:11.5px;color:var(--mut);margin-top:2px}
.cols{display:grid;gap:14px;grid-template-columns:1fr;margin-top:14px}
h2{font-family:var(--serif);font-weight:400;font-size:21px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h2 small{font-family:var(--sans);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--mut);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.share{margin:16px 0}.share .row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px}.share .row b{font-weight:500;color:var(--ig)}
.bar{height:9px;border-radius:9px;background:color-mix(in srgb,var(--fb) 55%,transparent);overflow:hidden}.bar span{display:block;height:100%;border-radius:9px;background:var(--ig);box-shadow:0 0 14px var(--ig)}
.post{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);align-items:flex-start}.post:last-child{border:0}
.rank{font-family:var(--serif);font-size:24px;width:26px;color:var(--glow);flex:none;line-height:1}
.post .t{font-size:14.5px;line-height:1.35}.post .m{font-size:12px;color:var(--mut);margin-top:4px}
.post .n{margin-left:auto;text-align:right;flex:none}.post .n b{font-weight:300;font-size:22px;display:block}.post .n a{font-size:11px;color:var(--glow);text-decoration:none;letter-spacing:1px;text-transform:uppercase}
.tag{display:inline-block;font-size:10px;letter-spacing:1px;padding:2px 7px;border-radius:999px;margin-right:6px;border:1px solid}
.tag.fb{color:var(--fb);border-color:color-mix(in srgb,var(--fb) 50%,transparent)}.tag.ig{color:var(--ig);border-color:color-mix(in srgb,var(--ig) 50%,transparent)}
table{width:100%;border-collapse:collapse;font-size:13px}th{font-weight:500;text-align:right;font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--mut);padding:6px 6px 8px}td{text-align:right;padding:9px 6px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}th:first-child,td:first-child{text-align:left}
.scroll{overflow-x:auto}
.empty{text-align:center;margin:14vh auto 0;max-width:460px}
.empty h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,8vw,48px);margin:0 0 10px}
.empty p{color:var(--mut);line-height:1.6}
.orb{width:150px;height:150px;margin:0 auto 26px;border-radius:50%;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--glow) 32%,transparent),color-mix(in srgb,var(--glow) 9%,transparent) 60%,transparent 72%);box-shadow:0 0 80px color-mix(in srgb,var(--glow) 20%,transparent);animation:breathe 12s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.84);opacity:.7}50%{transform:scale(1.06);opacity:1}}
.btn{color:var(--txt);text-decoration:none;display:inline-flex;align-items:center;gap:10px;padding:14px 24px;border-radius:999px;border:1px solid color-mix(in srgb,var(--glow) 60%,transparent);background:color-mix(in srgb,var(--glow) 10%,transparent);box-shadow:0 0 40px color-mix(in srgb,var(--glow) 15%,transparent);font-size:15px;letter-spacing:.5px}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 18px);display:flex;gap:10px;padding:8px;border-radius:999px;background:rgba(14,20,32,.72);border:1px solid var(--line);backdrop-filter:blur(18px);z-index:3}
.dock button{padding:12px 18px;border-radius:999px;font-size:14px;display:flex;gap:8px;align-items:center;color:var(--mut)}
.dock button.main{color:var(--txt);background:color-mix(in srgb,var(--glow) 16%,transparent);border:1px solid color-mix(in srgb,var(--glow) 55%,transparent)}
.dock svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:rgba(14,20,32,.95);backdrop-filter:blur(18px);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:22px 24px calc(env(safe-area-inset-bottom) + 28px);transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:6;max-height:86vh;overflow-y:auto}
.sheet.show{transform:none}.sheet h3{font-family:var(--serif);font-weight:400;font-size:23px;margin:0 0 14px}
.close{position:sticky;top:-8px;float:right;z-index:3;margin:-8px -8px 0 8px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:24px;line-height:1;color:var(--txt);background:rgba(40,48,66,.9);border:1px solid var(--line)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.3s;z-index:5}.scrim.show{opacity:1;pointer-events:auto}
.sec{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--mut);margin:20px 0 8px}
.drop{border:1.5px dashed color-mix(in srgb,var(--glow) 50%,transparent);border-radius:20px;padding:26px;text-align:center;color:var(--mut);line-height:1.6}
.drop.over{background:color-mix(in srgb,var(--glow) 10%,transparent)}
.dstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:4px}.dsr{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.04)}.dsh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}.dsh b{font-size:15px}.dsl{font-size:13px;line-height:1.5}.dsl b{font-weight:600}.dsf{font-size:11.5px;word-break:break-all;opacity:.8}.dst{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap}.dst.ok{background:rgba(22,184,92,.18);color:#5fe39a}.dst.due{background:rgba(240,180,40,.18);color:#f3c860}.dst.old{background:rgba(240,54,59,.18);color:#ff8a8d}.dst.none{background:rgba(255,255,255,.08);color:var(--sub)}
.opt{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px;gap:10px}
input[type=date]{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:9px 10px;color-scheme:dark}
.sw{width:42px;height:42px;border-radius:50%;border:2px solid transparent}.sw.on{border-color:#fff}
.toast{max-width:92vw;text-align:center;position:fixed;top:calc(env(safe-area-inset-top) + 16px);left:50%;transform:translate(-50%,-150%);background:rgba(14,20,32,.92);border:1px solid var(--line);padding:12px 20px;border-radius:999px;font-size:14px;transition:.4s;z-index:9}.toast.show{transform:translate(-50%,0)}
.note{font-size:11.5px;color:var(--mut);text-align:center;margin-top:22px;line-height:1.6}

.mut{color:var(--mut)}.sm{font-size:12.5px;line-height:1.5}
button.card{text-align:left;width:100%;cursor:pointer;transition:transform .2s,border-color .2s}button.card:hover{border-color:color-mix(in srgb,var(--glow) 45%,transparent)}button.card:active{transform:scale(.98)}
button.big{display:block;margin:6px auto 2px;color:inherit}
.hero.small{margin:3vh 0 1vh}.hero.small h1{font-size:clamp(30px,7vw,44px);font-style:normal;color:var(--txt)}
.range.left{justify-content:flex-start}.chip.sm{padding:6px 12px;font-size:12.5px}
.grid.g4{grid-template-columns:repeat(2,1fr)}@media(min-width:820px){.grid.g4{grid-template-columns:repeat(4,1fr)}}
.grid.tight{margin-top:10px;gap:10px}.kpi.mini .v{font-size:clamp(24px,6vw,30px);margin:6px 0 2px}
.tip{position:absolute;top:-6px;transform:translateX(-50%);background:rgba(14,20,32,.92);border:1px solid var(--line);border-radius:12px;padding:7px 11px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .2s;display:flex;flex-direction:column;gap:2px;white-space:nowrap}
svg.chart{touch-action:pan-y;cursor:crosshair}
.post{cursor:pointer}.post .pb{flex:1;min-width:0}.post .n span{font-size:10.5px;color:var(--mut);letter-spacing:1px;text-transform:uppercase}
.arow{display:grid;grid-template-columns:1fr auto 64px;gap:10px;align-items:center;width:100%;padding:11px 0;border-bottom:1px solid var(--line);text-align:left;font-size:14px}.arow b{font-weight:300;font-size:18px;text-align:right}.arow .mut{font-size:12px}
.more{width:100%;margin-top:12px;padding:12px;border-radius:999px;border:1px solid var(--line);color:var(--mut);font-size:13.5px}
tr.tap{cursor:pointer}tr.tap:hover td{background:rgba(255,255,255,.04)}
.hm th{font-size:9.5px;padding:4px 2px;text-align:center;white-space:nowrap}.hm td{text-align:center;font-size:11px;padding:8px 2px;border:2px solid transparent;border-radius:8px;cursor:pointer;background:color-mix(in srgb,var(--glow) calc(var(--a)*70%),rgba(255,255,255,.03));color:var(--txt)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}.filters .sortDir{flex:0 0 auto;white-space:nowrap;align-self:stretch;border-radius:12px;padding:0 14px}.filters input,.filters select{flex:1;min-width:140px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color-scheme:dark}
.sheet.wide{max-width:760px}
.bigline{font-weight:200;font-size:54px;line-height:1}.bigline small{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--mut);margin-left:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stats div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}.stats b{display:block;font-weight:300;font-size:22px}.stats span{font-size:11px;color:var(--mut);letter-spacing:1px;text-transform:uppercase}
.cap{font-family:var(--serif);font-size:16px;line-height:1.55;margin:0}
.hbar{display:grid;grid-template-columns:minmax(110px,38%) 1fr 58px;gap:10px;align-items:center;width:100%;padding:8px 0;font-size:13.5px;text-align:left}.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hbar b{font-weight:400;text-align:right}
.hbar .tr{height:8px;border-radius:8px;background:rgba(255,255,255,.07)}.hbar .tr span{display:block;height:100%;border-radius:8px}.hbar .tr .fb{background:var(--fb);box-shadow:0 0 10px var(--fb)}.hbar .tr .ig{background:var(--ig);box-shadow:0 0 10px var(--ig)}
a.btn:visited{color:var(--txt)}
.savebar{position:sticky;bottom:calc(-28px - env(safe-area-inset-bottom));margin:22px -24px calc(-28px - env(safe-area-inset-bottom));padding:6px 24px calc(env(safe-area-inset-bottom) + 18px);background:linear-gradient(to top,rgba(14,20,32,1) 70%,rgba(14,20,32,0))}
.savebar .btn{margin-top:8px}
.chip .ci{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;margin-right:5px}
.back{font-size:14px;color:var(--mut);margin:-4px 0 10px;padding:4px 0}
.btn.wide{width:100%;justify-content:center;margin-top:18px}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{padding:8px 13px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--mut)}.seg button.on{border-color:var(--glow);color:var(--txt);background:color-mix(in srgb,var(--glow) 12%,transparent)}
.swrow{display:flex;gap:14px;flex-wrap:wrap;padding-bottom:16px}.sw{position:relative}.sw small{position:absolute;top:47px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--mut);text-transform:capitalize}
.styles{display:flex;gap:12px}.stile{flex:1;display:flex;flex-direction:column;gap:7px;align-items:center;font-size:13px;color:var(--mut);padding:8px;border-radius:16px;border:1px solid var(--line)}.stile.on{border-color:var(--glow);color:var(--txt)}
.pv{width:100%;aspect-ratio:.72;border-radius:8px;padding:12% 10%;display:grid;grid-template-columns:1fr 1fr;gap:8%;align-content:start}.pv i,.pv em{display:block;height:28px;border-radius:5px;border:1px solid}.pv em{grid-column:span 2;height:44px}

.acctpick select option{background:#141b2a;color:#eef1f6}

#report{position:fixed;inset:0;z-index:8;background:#1a1f33;overflow:auto;display:none;padding:118px 10px 40px}

.rbar{position:fixed;top:0;left:0;right:0;display:flex;gap:10px;justify-content:center;align-items:center;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;background:rgba(14,20,32,.92);backdrop-filter:blur(12px);z-index:9;flex-wrap:wrap}

/* content scrolls under a soft fade so the dock never sits on hard text */
@media screen and (min-width:700px){body:has(#dock[style*="flex"])::after{content:"";position:fixed;left:0;right:0;bottom:0;height:110px;background:linear-gradient(to top,rgba(10,14,24,.78),rgba(10,14,24,0));pointer-events:none;z-index:2}}
@media print{body::after{display:none!important}}
</style>
</head>
<body>
<div class="sky"></div>
<div class="wrap" id="app"></div>
<div class="dock" id="dock" style="display:none">
  <button data-v="overview"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Today</button>
  <button data-v="explore"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Explore</button>
  <button data-v="signage"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Signage</button>
  <button id="bReport" class="main"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 13h7M9 17h5"/></svg>Report</button>
</div>
<input type="file" id="file" accept=".csv,text/csv,.json,application/json" multiple hidden>
<input type="file" id="bfile" accept=".json,application/json" hidden>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><button class="close" id="closeSheet">×</button><button class="shbtn" id="shareSheet" hidden aria-label="Share"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7.5 7.5L12 3l4.5 4.5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg><span>Share</span></button><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<div id="report"><div class="rbar"><button id="rBack">← Back</button><div id="rStyleBar"></div><button class="main" id="rPrint">Save as PDF</button><span>Tap text to edit · tap a post tile to add its image · more options in Settings</span></div><div id="pages"></div></div>
<script src="core.js"></script>
<script src="signage.js"></script>
<script src="tv.js"></script>
<script src="app.js"></script>
<script src="share.js"></script>
</body>
</html>
