<html lang="en">
<head>

<style>
:root{--txt:#eef1f6;--mut:rgba(238,241,246,.58);--line:rgba(255,255,255,.12);--glow:#f3d9a4;--card:rgba(255,255,255,.055);--fb:#8fb4ff;--ig:#f3a6b8;
--sky:radial-gradient(120% 80% at 50% 110%,#c98f6b 0%,#6d5a7a 28%,#2b3352 55%,#0e1420 85%);--serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body[data-theme=dawn]{--sky:radial-gradient(120% 80% at 50% 110%,#ffd3a5 0%,#f2a7a0 26%,#8f8bc6 56%,#34416e 92%);--glow:#fff1d6}
body[data-theme=ocean]{--sky:radial-gradient(120% 80% at 50% 110%,#6fd6d6 0%,#2b7a9e 28%,#173a5e 58%,#07142a 90%);--glow:#c8f6f2}
body[data-theme=forest]{--sky:radial-gradient(120% 80% at 50% 110%,#b9cc8c 0%,#55806a 28%,#1f3b33 58%,#0a1613 90%);--glow:#e6f2c4}
body[data-theme=midnight]{--sky:radial-gradient(120% 80% at 50% 110%,#1b2131 0%,#090b11 50%,#000 85%);--glow:#cfd8ec}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--txt);font-family:var(--sans);background:#0e1420;min-height:100%}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.sky{position:fixed;inset:0;background:var(--sky);z-index:0}
.wrap{position:relative;z-index:1}
.sky::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.06) 0 1px,transparent 2px) 0 0/90px 90px,radial-gradient(circle at 70% 40%,rgba(255,255,255,.05) 0 1px,transparent 2px) 0 0/130px 130px}
.wrap{max-width:1180px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) clamp(16px,4vw,36px) calc(env(safe-area-inset-bottom) + 110px)}
.top{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--mut)}
.top .icon{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:var(--card);backdrop-filter:blur(8px)}
.icon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hero{text-align:center;margin:4vh 0 3vh}
.hero h1{font-family:var(--serif);font-weight:400;font-style:italic;font-size:clamp(17px,4vw,22px);color:var(--mut);margin:0}
.big{font-family:var(--sans);font-weight:200;font-size:clamp(64px,17vw,124px);letter-spacing:-1px;line-height:1.05;margin:6px 0 2px;text-shadow:0 0 60px color-mix(in srgb,var(--glow) 40%,transparent)}
.sub{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--mut)}
.delta{display:inline-block;margin-top:10px;padding:5px 12px;border-radius:999px;font-size:13px;border:1px solid var(--line)}
.up{color:#9ee6b4}.down{color:#ffb0a8}
.range{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:18px 0 6px}
.range button,.chip{padding:9px 15px;border-radius:999px;border:1px solid var(--line);font-size:14px;color:var(--mut);backdrop-filter:blur(6px);background:rgba(255,255,255,.03)}
.range button.on,.chip.on{border-color:var(--glow);color:var(--txt);background:color-mix(in srgb,var(--glow) 13%,transparent)}
.rlabel{text-align:center;font-family:var(--serif);font-size:17px;margin-top:8px}
.rlabel small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);margin-top:4px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(2,1fr);margin-top:26px}
@media(min-width:820px){.grid{grid-template-columns:repeat(4,1fr)}.cols{grid-template-columns:1.6fr 1fr!important}}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.kpi .l{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--mut)}
.kpi .v{font-weight:250;font-size:clamp(30px,7vw,40px);margin:8px 0 4px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12.5px}
.kpi .s{font-size:11.5px;color:var(--mut);margin-top:2px}
.cols{display:grid;gap:14px;grid-template-columns:1fr;margin-top:14px}
h2{font-family:var(--serif);font-weight:400;font-size:21px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h2 small{font-family:var(--sans);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--mut);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.share{margin:16px 0}.share .row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px}.share .row b{font-weight:500;color:var(--ig)}
.bar{height:9px;border-radius:9px;background:color-mix(in srgb,var(--fb) 55%,transparent);overflow:hidden}.bar span{display:block;height:100%;border-radius:9px;background:var(--ig);box-shadow:0 0 14px var(--ig)}
.post{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);align-items:flex-start}.post:last-child{border:0}
.rank{font-family:var(--serif);font-size:24px;width:26px;color:var(--glow);flex:none;line-height:1}
.post .t{font-size:14.5px;line-height:1.35}
.post .t mark,.wprow mark{color:inherit;background:color-mix(in srgb,var(--glow,#f3d9a4) 30%,transparent);border-radius:3px;padding:0 1px}
.qhint{margin:2px 0 6px}.qhint b{font-weight:600;color:var(--txt)}
.post .m mark{color:inherit;background:color-mix(in srgb,var(--glow,#f3d9a4) 30%,transparent);border-radius:3px;padding:0 1px}
@media(max-width:560px){.filters #q{flex-basis:100%}}.post .m{font-size:12px;color:var(--mut);margin-top:4px}
.post .n{margin-left:auto;text-align:right;flex:none}.post .n b{font-weight:300;font-size:22px;display:block}.post .n a{font-size:11px;color:var(--glow);text-decoration:none;letter-spacing:1px;text-transform:uppercase}
.tag{display:inline-block;font-size:10px;letter-spacing:1px;padding:2px 7px;border-radius:999px;margin-right:6px;border:1px solid}
.tag.fb{color:var(--fb);border-color:color-mix(in srgb,var(--fb) 50%,transparent)}.tag.ig{color:var(--ig);border-color:color-mix(in srgb,var(--ig) 50%,transparent)}
table{width:100%;border-collapse:collapse;font-size:13px}th{font-weight:500;text-align:right;font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--mut);padding:6px 6px 8px}td{text-align:right;padding:9px 6px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}th:first-child,td:first-child{text-align:left}
.scroll{overflow-x:auto}
.empty{text-align:center;margin:14vh auto 0;max-width:460px}
.empty h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,8vw,48px);margin:0 0 10px}
.empty p{color:var(--mut);line-height:1.6}
.orb{width:150px;height:150px;margin:0 auto 26px;border-radius:50%;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--glow) 32%,transparent),color-mix(in srgb,var(--glow) 9%,transparent) 60%,transparent 72%);box-shadow:0 0 80px color-mix(in srgb,var(--glow) 20%,transparent);animation:breathe 12s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.84);opacity:.7}50%{transform:scale(1.06);opacity:1}}
.btn{color:var(--txt);text-decoration:none;display:inline-flex;align-items:center;gap:10px;padding:14px 24px;border-radius:999px;border:1px solid color-mix(in srgb,var(--glow) 60%,transparent);background:color-mix(in srgb,var(--glow) 10%,transparent);box-shadow:0 0 40px color-mix(in srgb,var(--glow) 15%,transparent);font-size:15px;letter-spacing:.5px}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 18px);display:flex;gap:10px;padding:8px;border-radius:999px;background:rgba(14,20,32,.72);border:1px solid var(--line);backdrop-filter:blur(18px);z-index:3}
.dock button{padding:12px 18px;border-radius:999px;font-size:14px;display:flex;gap:8px;align-items:center;color:var(--mut)}
.dock button.main{color:var(--txt);background:color-mix(in srgb,var(--glow) 16%,transparent);border:1px solid color-mix(in srgb,var(--glow) 55%,transparent)}
.dock svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:rgba(14,20,32,.95);backdrop-filter:blur(18px);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:22px 24px calc(env(safe-area-inset-bottom) + 28px);transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:6;max-height:86vh;max-height:calc(100dvh - env(safe-area-inset-top) - 48px);overflow-y:auto;overscroll-behavior:contain}
.sheet.show{transform:none}.sheet h3{font-family:var(--serif);font-weight:400;font-size:23px;margin:0 0 14px}
.close{position:sticky;top:-8px;float:right;z-index:3;margin:-8px -8px 0 8px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:24px;line-height:1;color:var(--txt);background:rgba(40,48,66,.9);border:1px solid var(--line)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.3s;z-index:5}.scrim.show{opacity:1;pointer-events:auto}
.sec{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--mut);margin:20px 0 8px}
.drop{border:1.5px dashed color-mix(in srgb,var(--glow) 50%,transparent);border-radius:20px;padding:26px;text-align:center;color:var(--mut);line-height:1.6}
.drop.over{background:color-mix(in srgb,var(--glow) 10%,transparent)}
.dstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:4px}.dsr{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.04)}.dsh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}.dsh b{font-size:15px}.dsl{font-size:13px;line-height:1.5}.dsl b{font-weight:600}.dsf{font-size:11.5px;word-break:break-all;opacity:.8}.dst{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap}.dst.ok{background:rgba(22,184,92,.18);color:#5fe39a}.dst.due{background:rgba(240,180,40,.18);color:#f3c860}.dst.old{background:rgba(240,54,59,.18);color:#ff8a8d}.dst.none{background:rgba(255,255,255,.08);color:var(--sub)}
.opt{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px;gap:10px}
input[type=date]{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:9px 10px;color-scheme:dark}
.sw{width:42px;height:42px;border-radius:50%;border:2px solid transparent}.sw.on{border-color:#fff}
.toast{max-width:92vw;text-align:center;position:fixed;top:calc(env(safe-area-inset-top) + 16px);left:50%;transform:translate(-50%,-150%);background:rgba(14,20,32,.92);border:1px solid var(--line);padding:12px 20px;border-radius:999px;font-size:14px;transition:.4s;z-index:9}.toast.show{transform:translate(-50%,0)}
.note{font-size:11.5px;color:var(--mut);text-align:center;margin-top:22px;line-height:1.6}

.mut{color:var(--mut)}.sm{font-size:12.5px;line-height:1.5}
button.card{text-align:left;width:100%;cursor:pointer;transition:transform .2s,border-color .2s}button.card:hover{border-color:color-mix(in srgb,var(--glow) 45%,transparent)}button.card:active{transform:scale(.98)}
button.big{display:block;margin:6px auto 2px;color:inherit}
.hero.small{margin:3vh 0 1vh}.hero.small h1{font-size:clamp(30px,7vw,44px);font-style:normal;color:var(--txt)}
.range.left{justify-content:flex-start}.chip.sm{padding:6px 12px;font-size:12.5px}
.grid.g4{grid-template-columns:repeat(2,1fr)}@media(min-width:820px){.grid.g4{grid-template-columns:repeat(4,1fr)}}
.grid.tight{margin-top:10px;gap:10px}.kpi.mini .v{font-size:clamp(24px,6vw,30px);margin:6px 0 2px}
.tip{position:absolute;top:-6px;transform:translateX(-50%);background:rgba(14,20,32,.92);border:1px solid var(--line);border-radius:12px;padding:7px 11px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .2s;display:flex;flex-direction:column;gap:2px;white-space:nowrap}
svg.chart{touch-action:pan-y;cursor:crosshair}
.post{cursor:pointer}.post .pb{flex:1;min-width:0}.post .n span{font-size:10.5px;color:var(--mut);letter-spacing:1px;text-transform:uppercase}
.arow{display:grid;grid-template-columns:1fr auto 64px;gap:10px;align-items:center;width:100%;padding:11px 0;border-bottom:1px solid var(--line);text-align:left;font-size:14px}.arow b{font-weight:300;font-size:18px;text-align:right}.arow .mut{font-size:12px}
.more{width:100%;margin-top:12px;padding:12px;border-radius:999px;border:1px solid var(--line);color:var(--mut);font-size:13.5px}
tr.tap{cursor:pointer}tr.tap:hover td{background:rgba(255,255,255,.04)}
.hm th{font-size:9.5px;padding:4px 2px;text-align:center;white-space:nowrap}.hm td{text-align:center;font-size:11px;padding:8px 2px;border:2px solid transparent;border-radius:8px;cursor:pointer;background:color-mix(in srgb,var(--glow) calc(var(--a)*70%),rgba(255,255,255,.03));color:var(--txt)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}.filters .sortDir{flex:0 0 auto;white-space:nowrap;align-self:stretch;border-radius:12px;padding:0 14px}.filters input,.filters select{flex:1;min-width:140px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color-scheme:dark}
.sheet.wide{max-width:760px}
.bigline{font-weight:200;font-size:54px;line-height:1}.bigline small{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--mut);margin-left:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stats div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}.stats b{display:block;font-weight:300;font-size:22px}.stats span{font-size:11px;color:var(--mut);letter-spacing:1px;text-transform:uppercase}
.cap{font-family:var(--serif);font-size:16px;line-height:1.55;margin:0}
.hbar{display:grid;grid-template-columns:minmax(110px,38%) 1fr 58px;gap:10px;align-items:center;width:100%;padding:8px 0;font-size:13.5px;text-align:left}.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hbar b{font-weight:400;text-align:right}
.hbar .tr{height:8px;border-radius:8px;background:rgba(255,255,255,.07)}.hbar .tr span{display:block;height:100%;border-radius:8px}.hbar .tr .fb{background:var(--fb);box-shadow:0 0 10px var(--fb)}.hbar .tr .ig{background:var(--ig);box-shadow:0 0 10px var(--ig)}
a.btn:visited{color:var(--txt)}
.savebar{position:sticky;bottom:calc(-28px - env(safe-area-inset-bottom));margin:22px -24px calc(-28px - env(safe-area-inset-bottom));padding:6px 24px calc(env(safe-area-inset-bottom) + 18px);background:linear-gradient(to top,rgba(14,20,32,1) 70%,rgba(14,20,32,0))}

.chip .ci{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;margin-right:5px}
.back{font-size:14px;color:var(--mut);margin:-4px 0 10px;padding:4px 0}
.btn.wide{width:100%;justify-content:center;margin-top:18px}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{padding:8px 13px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--mut)}.seg button.on{border-color:var(--glow);color:var(--txt);background:color-mix(in srgb,var(--glow) 12%,transparent)}
.swrow{display:flex;gap:14px;flex-wrap:wrap;padding-bottom:16px}.sw{position:relative}.sw small{position:absolute;top:47px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--mut);text-transform:capitalize}
.styles{display:flex;gap:12px}.stile{flex:1;display:flex;flex-direction:column;gap:7px;align-items:center;font-size:13px;color:var(--mut);padding:8px;border-radius:16px;border:1px solid var(--line)}.stile.on{border-color:var(--glow);color:var(--txt)}

.gsin.lined{border-bottom-color:var(--line)}
.gsin .fld{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:14px;padding:0 6px 0 12px}
.gsin .fld:focus-within{border-color:color-mix(in srgb,var(--glow) 60%,transparent)}
.gsin svg{width:18px;height:18px;fill:none;stroke:var(--mut);stroke-width:1.8;stroke-linecap:round;flex:none}
.gsin input{flex:1;min-width:0;background:none;border:0;outline:0;padding:13px 0;font-size:16px;color:var(--txt);caret-color:var(--glow)}
.gsin input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.gsin .gclr{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--mut);font-size:19px;flex:none}
.gsin .gclr[hidden]{display:none}
.gsin .done{color:var(--mut);font-size:14px;min-height:44px;padding:0 4px}
.gsum{font-size:12px;color:var(--mut);margin:12px 0 0}.gsum b{color:var(--txt);font-weight:500}
.ggrp{margin-top:16px}
.ggrp .gh{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--mut);margin:0}
.ggrp .gh b{font-weight:500;color:var(--txt);letter-spacing:1px;margin-left:6px}
.ggrp .gh button{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--glow);min-height:40px;padding:0 0 0 12px}
.gres{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:11px 0;border-top:1px solid var(--line);color:var(--txt)}
.gres:focus-visible{outline:2px solid color-mix(in srgb,var(--glow) 70%,transparent);outline-offset:2px;border-radius:8px}
.gres .gi{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--mut)}
.gres .gi svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.gres .gb{flex:1;min-width:0}
.gres .gt{display:-webkit-box;font-size:14.5px;line-height:1.35;overflow:hidden;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.gres .gm{display:block;font-size:12px;color:var(--mut);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gres .gn{flex:none;text-align:right;font-weight:300;font-size:17px;font-variant-numeric:tabular-nums}
.gres .gn small{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.gres mark{color:inherit;background:color-mix(in srgb,var(--glow,#f3d9a4) 30%,transparent);border-radius:3px;padding:0 1px}
.gres .gm mark{color:var(--txt)}
.gempty{color:var(--mut);font-size:13.5px;margin:18px 0 4px}
.gnone{color:var(--mut);font-size:12px;margin-top:16px}
.gtry{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.gkeys{display:none;font-size:11.5px;color:var(--mut);margin-top:16px}
.gkeys kbd{font:inherit;border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin:0 2px}
.gflash{animation:gflash 2.2s ease-out}
@keyframes gflash{0%,30%{box-shadow:0 0 0 2px color-mix(in srgb,var(--glow) 75%,transparent)}100%{box-shadow:0 0 0 2px transparent}}
@media(max-width:819px){#gs.sheet{top:calc(env(safe-area-inset-top) + 36px);max-height:none;border-radius:22px 22px 0 0}}
@media(min-width:820px){
 .gkeys{display:block}.gsin .done{display:none}
 #gs.sheet{top:12vh;bottom:auto;left:50%;right:auto;margin:0;width:min(720px,92vw);max-width:none;max-height:76vh;border-radius:24px;border-bottom:1px solid var(--line);padding-bottom:24px;transform:translate(-50%,10px) scale(.98);opacity:0;visibility:hidden;pointer-events:none;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .2s,visibility 0s .3s}
 #gs.sheet.show{transform:translate(-50%,0);opacity:1;visibility:visible;pointer-events:auto;transition-delay:0s}
}
@media(prefers-reduced-motion:reduce){#gs.sheet{transition:none}.gflash{animation:none}}
@media print{#gs,#gscrim{display:none!important}}
/*HUBCSS*/
/* ---- v36 hub: Today hub, channel tabs, Strategic Events, Program coverage (classes prefixed to avoid clashes) ---- */
:root{--so:#f3a6b8;--we:#8fb4ff;--em:#c7b3ff;--sg:#9ee6b4;--good:#9ee6b4;--bad:#ffb0a8;--warn:#f3c860;--mut2:rgba(238,241,246,.76);--line2:rgba(255,255,255,.2)}
svg.hi{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
.warn{color:var(--warn)}.mut2{color:var(--mut2)}
/* dock: 6 + Report on desktop, Today · Channels · Events · Report on phones */
.dock{gap:4px;padding:7px}.dock button{padding:11px 15px}.dock .ph{display:none}.dock .dsep{width:1px;background:var(--line);margin:6px 2px}
@media(max-width:699px){#dock .dk{display:none}#dock .ph{display:flex}#dock{width:calc(100% - 28px);max-width:400px;justify-content:space-between;gap:2px;padding:6px}#dock button{flex:1;flex-direction:column;gap:3px;padding:8px 6px;font-size:11px;justify-content:center}#dock .dsep{display:none}}
@media(min-width:700px) and (max-width:1000px){.dock button{padding:10px 11px;font-size:13px;gap:6px}}
/* channel pills (phones) + Social sub-tabs */
.chpills{display:none}
@media(max-width:699px){.chpills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:14px 0 2px;justify-content:center}.chpills::-webkit-scrollbar{display:none}.chpills button{padding:7px 14px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--mut2);white-space:nowrap;background:rgba(255,255,255,.03)}.chpills button.on{border-color:var(--glow);color:var(--txt);background:color-mix(in srgb,var(--glow) 12%,transparent)}}
.xlead>.chpills{grid-area:mode}
.socsub{display:flex;gap:4px;border:1px solid var(--line);border-radius:999px;padding:3px;background:rgba(14,20,32,.4);width:max-content;max-width:100%;margin:14px auto 0;overflow-x:auto}
.socsub button{font-size:13.5px;padding:8px 16px;border-radius:999px;color:var(--mut2);white-space:nowrap}
.socsub button.on{background:color-mix(in srgb,var(--glow) 16%,rgba(255,255,255,.04));color:var(--txt);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--glow) 55%,transparent)}
@media(min-width:1100px){.socsub{margin:10px 0 0}}
/* channel badge, event tag, status chips, channel dots */
.cb{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid;white-space:nowrap;line-height:1.5}
.cb svg.hi{width:11px;height:11px;vertical-align:0}
.cb.so{color:var(--so);border-color:color-mix(in srgb,var(--so) 50%,transparent)}.cb.we{color:var(--we);border-color:color-mix(in srgb,var(--we) 50%,transparent)}.cb.em{color:var(--em);border-color:color-mix(in srgb,var(--em) 50%,transparent)}.cb.sg{color:var(--sg);border-color:color-mix(in srgb,var(--sg) 50%,transparent)}
.evtag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 8px;border-radius:7px;background:rgba(243,217,164,.13);color:var(--glow);margin-left:6px;white-space:nowrap;vertical-align:1px;max-width:220px;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.evtag svg.hi{width:11px;height:11px;vertical-align:0}.evtag.q{background:rgba(255,255,255,.07);color:var(--mut2)}
.wtag{display:inline-flex;margin:0 6px}.wtag .evtag{margin-left:0}
.wprow:has(.wtag){grid-template-columns:24px 1fr auto auto 60px}
.evst{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:999px;white-space:nowrap}
.evst::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.evst.up_{background:rgba(255,255,255,.08);color:var(--mut2)}.evst.pr{background:rgba(243,217,164,.15);color:var(--glow)}.evst.lv{background:rgba(158,230,180,.16);color:var(--good)}.evst.wr{background:rgba(143,180,255,.14);color:#b7cdff}.evst.nd{background:rgba(255,255,255,.05);color:var(--mut)}
.evst.lv::before{box-shadow:0 0 0 3px rgba(158,230,180,.25);animation:hpulse 2s ease-in-out infinite}
@keyframes hpulse{50%{box-shadow:0 0 0 6px rgba(158,230,180,0)}}
.dots{display:inline-flex;gap:5px;align-items:center}.dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid;opacity:.7}.dots i.f{opacity:1}
.dots i.so{border-color:var(--so)}.dots i.we{border-color:var(--we)}.dots i.em{border-color:var(--em)}.dots i.sg{border-color:var(--sg)}
.dots i.f.so{background:var(--so)}.dots i.f.we{background:var(--we)}.dots i.f.em{background:var(--em)}.dots i.f.sg{background:var(--sg)}
.hbtn{display:inline-flex;align-items:center;gap:8px;padding:10px 17px;border-radius:999px;border:1px solid color-mix(in srgb,var(--glow) 60%,transparent);background:color-mix(in srgb,var(--glow) 12%,transparent);color:var(--txt);font-size:14px;white-space:nowrap;text-decoration:none;cursor:pointer}
.hbtn.ghost{border-color:var(--line);background:rgba(255,255,255,.04)}.hbtn.sm{padding:7px 13px;font-size:13px}a.hbtn:visited{color:var(--txt)}
.lbl{font-size:13px;color:var(--mut2)}.rule{height:1px;background:var(--line);margin:14px 0}
/* live strip */
.hlive{display:flex;align-items:center;gap:14px;flex-wrap:wrap;width:100%;margin:16px 0 0;padding:11px 16px;border-radius:16px;border:1px solid rgba(158,230,180,.3);background:rgba(158,230,180,.07);color:var(--txt);font-size:14px;text-align:left}
.hlive b{font-weight:500}.hlive .go{margin-left:auto;color:var(--good);font-size:13.5px;white-space:nowrap}
/* TODAY lead: blended hero + 4 channel tiles */
.hlead{display:grid;gap:14px;margin-top:10px;grid-template-columns:minmax(0,1fr)}.hlead>*{min-width:0}
.hhero{text-align:center;padding:10px 0 4px}
.hhero .eyebrow{font-family:var(--serif);font-style:italic;font-size:clamp(17px,1.4vw,21px);color:var(--mut2)}
.hbig{display:block;margin:4px auto 2px;color:inherit;font-weight:200;font-size:clamp(68px,16vw,118px);letter-spacing:-1px;line-height:1.02;text-shadow:0 0 60px color-mix(in srgb,var(--glow) 40%,transparent);font-variant-numeric:tabular-nums}
.hhero .what{font-size:14px;color:var(--mut2)}
.blend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 12px;margin-top:14px;font-size:12.5px;color:var(--mut2)}
.blend span{white-space:nowrap}.blend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.blend .eq{color:var(--mut)}
.blendnote{font-size:12px;color:var(--mut);margin:8px auto 0;line-height:1.45;max-width:46ch}
.hrange{margin-top:14px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;overflow:hidden;display:block;text-align:left}
.tile .h{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--mut2)}
.tile .ci{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1px solid}.tile .ci svg.hi{width:14px;height:14px;vertical-align:0}
.tile .go{margin-left:auto;color:var(--mut);font-size:16px}
.tile .v{font-weight:250;font-size:clamp(30px,2.4vw,44px);margin:10px 0 2px;font-variant-numeric:tabular-nums;line-height:1.05}.tile .v small{font-size:.5em;color:var(--mut)}
.tile .l{font-size:12.5px;color:var(--mut2)}.tile .d{font-size:12.5px;margin-top:4px}
.tile svg.sp{display:block;width:100%;height:42px;margin-top:10px}
.tile .x{font-size:12px;color:var(--mut);margin-top:6px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .sgbar{height:8px;border-radius:8px;background:rgba(255,255,255,.08);margin:22px 0 12px;overflow:hidden}.tile .sgbar span{display:block;height:100%;border-radius:8px;background:var(--sg)}
.c-so .ci{color:var(--so);border-color:color-mix(in srgb,var(--so) 45%,transparent)}.c-we .ci{color:var(--we);border-color:color-mix(in srgb,var(--we) 45%,transparent)}.c-em .ci{color:var(--em);border-color:color-mix(in srgb,var(--em) 45%,transparent)}.c-sg .ci{color:var(--sg);border-color:color-mix(in srgb,var(--sg) 45%,transparent)}
@media(min-width:1100px){.hlead{grid-template-columns:minmax(0,4.2fr) minmax(0,7.8fr);align-items:center;column-gap:clamp(24px,3vw,56px)}.hhero{text-align:left}.hbig{margin:4px 0 2px;font-size:clamp(84px,7vw,140px)}.blend,.hrange{justify-content:flex-start}.blendnote{margin-left:0}
 .hrange{flex-wrap:wrap}.hrange button{padding:7px 12px;font-size:13px}}
@media(min-width:1600px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}.hlead{grid-template-columns:minmax(0,3.6fr) minmax(0,8.4fr)}}
/* last / next event cards */
.evrow{display:grid;gap:14px;margin-top:16px}
@media(min-width:900px){.evrow{grid-template-columns:1fr 1fr}}
.evcard{display:block;text-align:left}
.evcard .top2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.evcard .kind{font-size:13px;color:var(--mut2)}
.evcard h3{font-family:var(--serif);font-weight:400;font-size:clamp(24px,1.9vw,32px);margin:8px 0 2px;letter-spacing:-.01em;line-height:1.1}
.evcard .meta{font-size:13px;color:var(--mut)}
.evcard .res{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap;margin:14px 0 6px}
.evcard .bv,.evcard .count b{font-weight:200;font-size:clamp(46px,4vw,64px);line-height:1;font-variant-numeric:tabular-nums}
.evcard .bl{font-size:13px;color:var(--mut2);margin-top:4px}
.evcard .cmp{display:flex;flex-direction:column;gap:6px;font-size:13.5px;padding-bottom:4px}.evcard .cmp b{font-weight:500}
.evcard .count{display:flex;align-items:baseline;gap:8px}
.goalbar{height:8px;border-radius:8px;background:rgba(255,255,255,.08);position:relative;margin:12px 0 18px}
.goalbar span{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,color-mix(in srgb,var(--glow) 70%,transparent),var(--glow))}
.goalbar em{position:absolute;top:-5px;width:2px;height:18px;background:var(--txt);border-radius:2px}.goalbar em::after{content:attr(data-l);position:absolute;top:20px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--mut2);font-style:normal;white-space:nowrap}
.chs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}
.chs>div{padding:10px 11px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);min-width:0}
.chs .t{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut2)}.chs .t i{width:8px;height:8px;border-radius:50%;flex:none}
.chs b{display:block;font-weight:300;font-size:20px;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chs small{display:block;font-size:11.5px;color:var(--mut);margin-top:2px;line-height:1.35}
.chs .miss{border-style:dashed;border-color:rgba(243,200,96,.5);background:rgba(243,200,96,.06)}.chs .miss b{color:var(--warn);font-size:15px;margin-top:7px;white-space:normal}
.pace{margin-top:14px}.pace .row{display:flex;justify-content:space-between;font-size:13px;color:var(--mut2);margin-bottom:6px;gap:10px}
.pace .trk{position:relative;height:10px;border-radius:10px;background:rgba(255,255,255,.08)}.pace .trk span{position:absolute;left:0;top:0;bottom:0;border-radius:10px;background:var(--glow)}.pace .trk em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--txt)}
.evcard .foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px;flex-wrap:wrap}
/* top content + needs attention */
.hbot{display:grid;gap:14px;margin-top:16px}
@media(min-width:1100px){.hbot{grid-template-columns:minmax(0,2fr) minmax(0,1fr);align-items:start}}
.topc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(min-width:760px){.topc{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tc{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:rgba(255,255,255,.04);display:flex;flex-direction:column;text-align:left;cursor:pointer;transition:border-color .2s}.tc:hover{border-color:color-mix(in srgb,var(--glow) 45%,transparent)}
.thumb{width:100%;aspect-ratio:16/10;position:relative;overflow:hidden;background:linear-gradient(150deg,#1d2433,#465473 60%,#9aa6c2)}
.thumb.t-so{background:linear-gradient(135deg,#3b2a6e,#c2477a 60%,#f2a65a)}.thumb.t-we{background:linear-gradient(160deg,#1c2b4a,#2f5b8f 60%,#8fb4ff)}.thumb.t-em{background:linear-gradient(160deg,#2a2347,#5b4a9e 60%,#c7b3ff)}.thumb.t-sg{background:linear-gradient(150deg,#0c2418,#1f6b45 55%,#9ee6b4)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}.thumb img.in{opacity:1}
.thumb .cb{position:absolute;top:9px;left:9px;background:rgba(14,20,32,.72);backdrop-filter:blur(6px)}
.thumb .evt{position:absolute;top:9px;right:9px;font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(243,217,164,.92);color:#1b1a22;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc .b{padding:11px 12px 13px}.tc .t{font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tc .m{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;gap:8px}.tc .m b{font-weight:300;font-size:22px;font-variant-numeric:tabular-nums}.tc .m span{font-size:12px;color:var(--mut);text-align:right}
.att{display:flex;flex-direction:column}
.att>button{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line);color:var(--txt);text-align:left;width:100%}.att>button:last-child{border:0}
.att .ic,.wkrow .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);flex:none}.att .ic svg.hi,.wkrow .ic svg.hi{width:15px;height:15px;vertical-align:0}
.att .ic.warn,.wkrow .ic.warn{color:var(--warn)}.att .ic.down{color:var(--bad)}
.att .t{font-size:14px;line-height:1.35}.att .s{font-size:12.5px;color:var(--mut);margin-top:3px;line-height:1.4}.att .go{font-size:12.5px;color:var(--glow);white-space:nowrap;padding-top:2px}
/* phone Channels sheet */
.picks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.pick{display:block;padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--txt);text-align:left}
.pick b{display:block;font-weight:250;font-size:26px;margin-top:8px;font-variant-numeric:tabular-nums}.pick small{font-size:12px;color:var(--mut)}
/* event filter row */
.evfilter{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0 8px;font-size:13px;color:var(--mut2)}
.evfilter .lbl{margin-right:4px}.evfilter .chip small{color:var(--mut);margin-left:2px}
/* page header (events) */
.hph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:22px 0 4px}
.hph h1{font-family:var(--serif);font-weight:400;font-size:clamp(32px,4vw,46px);letter-spacing:-.015em;margin:0;line-height:1.05}
.hph p{margin:6px 0 0;color:var(--mut2);font-size:15px;max-width:68ch;line-height:1.5}
.hph .acts,.dh .acts{display:flex;gap:10px;flex-wrap:wrap}
.evlayout{display:grid;gap:16px;margin-top:18px}.evmain{display:flex;flex-direction:column;gap:16px;min-width:0}
@media(min-width:1200px){.evlayout{grid-template-columns:minmax(0,1fr) 360px;align-items:start}}
@media(min-width:1600px){.evlayout{grid-template-columns:minmax(0,1fr) 420px}}
.hside{display:flex;flex-direction:column;gap:14px;min-width:0}
/* timeline */
.tl{position:relative;overflow-x:auto}.tl .inner{min-width:760px;position:relative}
.tl .months{display:grid;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--mut2)}.tl .months div{padding:0 0 8px 8px;border-left:1px solid var(--line)}
.tl .lanes{position:relative;padding:4px 0 2px}

.cn .feed .more{margin-top:8px}
/* rules */
.cn-rlay{display:grid;gap:16px;margin-top:18px}
.cn-rbar{display:flex;justify-content:flex-end;margin:-4px 0 10px}
.cn .rtbl{width:100%;border-collapse:collapse;font-size:14px}
.cn .rtbl th{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.cn .rtbl td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle;text-align:left}
.cn .rtbl tr:last-child td{border:0}
.cn .rtbl tr.off td{opacity:.5}.cn .rtbl tr.off td:last-child{opacity:1}
.cn .rtbl td:nth-child(4){max-width:320px}
.cn .rtype{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mut2);white-space:nowrap}
.cn-sw{position:relative;width:44px;height:26px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid var(--line2);transition:.2s;flex:none}
.cn-sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#cfd5e0;transition:.2s}
.cn-sw.on{background:rgba(158,230,180,.4);border-color:rgba(158,230,180,.6)}
.cn-sw.on::after{left:20px;background:#fff}
.cn .rcards{display:none}
@media(max-width:820px){.cn .rtbl{display:none}.cn .rcards{display:block}}
.cn .rc{padding:13px 0;border-bottom:1px solid var(--line)}
.cn .rc:last-child{border:0}
.cn .rc .r1{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cn .rc .r1>div{min-width:0;overflow-wrap:anywhere}
.cn .rc .r2{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mut2);min-width:0}
.cn .rc .r3{margin-top:6px;font-size:12px;color:var(--mut)}
.cn .rc.off .r1>div,.cn .rc.off .r2,.cn .rc.off .r3{opacity:.5}
.cn-flow{display:grid;gap:12px;margin-top:4px}
@media(min-width:900px){.cn-flow{grid-template-columns:1fr auto 1fr auto 1fr;align-items:stretch}}
.cn-flow .st{padding:14px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.035);min-width:0}
.cn-flow .st .n{font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--glow)}
.cn-flow .st h5{font-family:var(--serif);font-weight:400;font-size:18px;margin:6px 0;line-height:1.2}
.cn-flow .st p{margin:0;font-size:13px;color:var(--mut2);line-height:1.5}
.cn-flow .ar{display:grid;place-items:center;color:var(--mut)}
@media(max-width:899px){.cn-flow .ar{transform:rotate(90deg);height:18px}}
.cn-addc{background:rgba(255,255,255,.03)!important;margin-bottom:14px}
.cn .addf{display:grid;gap:10px}
@media(min-width:900px){.cn .addf{grid-template-columns:170px minmax(0,1fr) minmax(0,1.2fr) auto;align-items:end}}
.cn-fld{display:block;min-width:0}
.cn-fld>span{display:block;font-size:12.5px;color:var(--mut2);margin-bottom:6px}
.cn-fld input,.cn-fld select{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;font-size:14.5px;outline:none;color:var(--txt);font-family:inherit}
.cn-fld select{color-scheme:dark}.cn-fld select option{background:#141c2c}
.cn .pvw{font-size:13px;color:var(--mut2);padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px dashed var(--line2);margin-top:10px;line-height:1.5}
.cn .pvw svg{vertical-align:-2px}
/* how */
.cn-how{display:grid;gap:16px;margin-top:18px}
@media(min-width:1000px){.cn-how{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.cn .pts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.cn .pts li{display:grid;grid-template-columns:38px minmax(0,1fr);gap:12px;align-items:start}
.cn .pts .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(243,217,164,.1);color:var(--glow);border:1px solid rgba(243,217,164,.3)}
.cn .pts b{display:block;font-weight:500;font-size:15px}
.cn .pts span{display:block;font-size:13.5px;color:var(--mut2);line-height:1.5;margin-top:3px}
.cn .diag{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;padding:6px 0 4px}
.cn .diag .nd{padding:10px 12px;border-radius:14px;border:1px solid var(--line2);background:rgba(255,255,255,.05);font-size:13px;text-align:center;min-width:96px}
.cn .diag .nd small{display:block;color:var(--mut);font-size:11.5px;margin-top:2px}
.cn .diag .nd.m{border-color:rgba(158,230,180,.5);background:rgba(158,230,180,.08)}
.cn .diag .arr{color:var(--mut);font-size:16px}
.cn-cols{width:100%;border-collapse:collapse;font-size:13px}.cn-cols th{text-align:left;font-weight:500;padding:7px 10px 7px 0;white-space:nowrap;vertical-align:top;color:var(--txt)}.cn-cols td{padding:7px 0;color:var(--mut2);border-bottom:1px solid var(--line)}.cn-cols th{border-bottom:1px solid var(--line)}
.cn-priv{display:flex;gap:10px;padding:12px 14px;border-radius:14px;border:1px solid rgba(143,180,255,.35);background:rgba(143,180,255,.07);font-size:13px;color:var(--mut2);line-height:1.5}
.cn-priv svg{color:var(--we);margin-top:2px;flex:none}
.cn-stat .srow{display:flex;align-items:center;gap:12px;padding:6px 0 10px}.cn-stat .sic{display:none}.cn-stat .slb{flex:1;font-size:15px}.cn-stat .slb small{display:block;font-size:12.5px;color:var(--mut2);margin-top:2px}
/* team card, row buttons, sheets */
.cn-team .cn-trow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.cn-team .cn-trow:last-of-type{border:0}
.cn-team .cn-th{width:40px;height:40px;border-radius:10px}
.cn-team .t{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cn-team .s{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px;font-size:12px;color:var(--mut)}
.cn-cbtn{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mut2);background:rgba(255,255,255,.04);white-space:nowrap;margin-left:6px;vertical-align:1px;cursor:pointer}
.cn-cbtn:hover{border-color:color-mix(in srgb,var(--glow) 55%,transparent);color:var(--txt)}
.cn-team .cn-cbtn{margin-left:0}
.cn-sheetbtn{margin:6px 0 12px}
.cn-slidebig{margin:10px 0 12px;border-radius:14px;overflow:hidden;background:#05070c}.cn-slidebig img{display:block;width:100%;height:auto;opacity:0;transition:opacity .3s}.cn-slidebig img.in{opacity:1}
/* name prompt */
.cn-mod{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:18px}
.cn-mod.show{display:flex}
.cn-modal{width:min(420px,100%);background:rgba(14,20,32,.98);border:1px solid var(--line);border-radius:22px;padding:20px;color:var(--txt);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.cn-modal h3{font-family:var(--serif);font-weight:400;font-size:24px;margin:0 0 6px}
.cn-modal p{margin:0 0 14px;color:var(--mut2);font-size:14px;line-height:1.5}
.cn-row2{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px;margin-bottom:14px}
.cn-modal .cn-acts{justify-content:flex-end}
.cn-setacts{gap:10px;justify-content:flex-start;flex-wrap:wrap}
@media(max-width:520px){
 .cn .card{padding:16px}.cn .kv b{font-size:19px}.cn .detail{padding:16px}.cn .media{padding:14px}
 .cn-ban .diff b{font-size:15px}.cn-seg button{padding:8px 12px;font-size:13.5px}
 .cn-ph p{display:none}.cn-prev.p-reel{max-width:176px}
 .cn .qc{flex-basis:220px;grid-template-columns:44px minmax(0,1fr);padding:8px}.cn .qc .cn-th{width:44px;height:44px}
 .cn .queue{padding:10px 0 8px}.cn .queue h2{font-size:19px}
 .cn-ban .diff{grid-template-columns:1fr}
 .cn .feed .fi{grid-template-columns:30px minmax(0,1fr)}.cn .feed .fi>:last-child{grid-column:2;justify-self:start}.cn-av{width:30px;height:30px;font-size:11.5px}
}
@media(max-width:699px){.cn-seg{-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}}
@media print{.cn-drawer,.cn-scrim,.cn-mod{display:none!important}}
/*/CNCSS*/
</style>
</head>
<body>
<div class="sky"></div>
<div class="wrap" id="app"></div>
<nav class="dock" id="dock" style="display:none" aria-label="Sections">
  <button data-v="overview"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Today</button>
  <button data-v="explore" data-dm="social" class="dk"><svg viewBox="0 0 24 24"><path d="M7 10h10M7 14h6"/><path d="M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-6l-5 4v-4H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>Social</button>
  <button data-v="explore" data-dm="web" class="dk"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>Web</button>
  <button data-v="explore" data-dm="email" class="dk"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>Email</button>
  <button data-v="signage" class="dk"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Signage</button>
  <button id="bChan" class="ph" aria-label="Channels"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>Channels</button>
  <button data-v="events"><svg viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/></svg>Events</button>
  <button data-v="programs"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><path d="M13 16.5h7M16.5 13v7"/></svg>Programs</button>
  <button data-v="connections"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span class="dl">Connections</span><span class="dp">Connect</span></button>
  <span class="dsep" aria-hidden="true"></span>
  <button id="bReport" class="main"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 13h7M9 17h5"/></svg>Report</button>
</nav>
<input type="file" id="file" accept=".csv,text/csv,.json,application/json" multiple hidden>
<input type="file" id="bfile" accept=".json,application/json" hidden>

<div class="sheet" id="sheet"><button class="close" id="closeSheet" aria-label="Close">×</button><button class="shbtn" id="shareSheet" hidden aria-label="Share"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7.5 7.5L12 3l4.5 4.5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg><span>Share</span></button><div id="sheetBody"></div></div>
<div class="scrim" id="gscrim"></div>
<div class="sheet" id="gs" role="dialog" aria-modal="true" aria-label="Search everything">
 <div class="gsin"><label class="fld"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="gq" type="search" placeholder="Search everything" autocomplete="off" spellcheck="false" enterkeyhint="search" aria-label="Search everything"><button class="gclr" id="gclr" aria-label="Clear search" hidden>×</button></label><button class="done" id="gdone">Done</button></div>
 <div id="gbody" aria-live="polite"></div>
</div>
<div class="toast" id="toast"></div>
<div id="report"><div class="rbar"><button id="rBack">← Back</button><div id="rStyleBar"></div><button class="main" id="rPrint">Save as PDF</button><span>Tap text to edit · tap a post tile to add its image · more options in Settings</span></div><div id="pages"></div></div>
