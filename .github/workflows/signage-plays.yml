name: Signage plays (ScreenCloud proof-of-play)
on:
  schedule:
    - cron: '20 16 * * *'   # 01:20 JST daily: re-pull last 3 days + continue backfill
  workflow_dispatch:
    inputs:
      mode:
        description: daily | backfill | probe
        default: backfill
permissions:
  contents: write
  actions: write
concurrency:
  group: signage-plays
  cancel-in-progress: false
jobs:
  plays:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        if: ${{ inputs.mode == 'probe' }}
        env:
          SCREENCLOUD_API_KEY: ${{ secrets.SCREENCLOUD_API_KEY }}
        run: python3 .github/signage/plays_probe.py
      - name: Tools
        if: ${{ inputs.mode != 'probe' }}
        run: pip install -q cryptography
      - name: Pull plays
        id: pull
        if: ${{ inputs.mode != 'probe' }}
        env:
          SCREENCLOUD_API_KEY: ${{ secrets.SCREENCLOUD_API_KEY }}
          PLAYS_BUDGET_MIN: '35'
          PLAYS_CHECKPOINT_MIN: '10'
        run: python3 .github/signage/publish_plays.py "${{ inputs.mode || 'daily' }}"
      - name: Commit
        if: ${{ always() && inputs.mode != 'probe' }}
        run: |
          git config user.name "Pulse Signage Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A signage-plays.json signage-plays.bin signage-plays.state 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -qm "Signage plays sync"
          # This job owns these files: put them on top of the newest main instead of rebasing
          # (a half-finished rebase blocks every retry).
          T=$(mktemp -d); for f in signage-plays.json signage-plays.bin signage-plays.state; do [ -e "$f" ] && cp -r "$f" "$T/"; done
          for i in 1 2 3 4; do
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            for f in signage-plays.json signage-plays.bin signage-plays.state; do [ -e "$T/$f" ] && rm -rf "$f" && cp -r "$T/$f" .; done
            git add -A signage-plays.json signage-plays.bin signage-plays.state 2>/dev/null || true
            if git diff --cached --quiet; then echo "nothing new after refresh"; exit 0; fi
            git commit -qm "Signage plays sync" && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
      - name: Continue backfill
        if: ${{ always() && steps.pull.outputs.more == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run signage-plays.yml -f mode=backfill --ref main
