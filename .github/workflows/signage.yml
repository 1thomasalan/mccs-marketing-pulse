name: Signage sync (ScreenCloud)
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signage
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg poppler-utils >/dev/null
          pip install -q cryptography
      - name: Pull ScreenCloud
        env:
          SCREENCLOUD_API_KEY: ${{ secrets.SCREENCLOUD_API_KEY }}
        run: python3 .github/signage/publish.py
      - name: Commit
        run: |
          git config user.name "Pulse Signage Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A signage.json signage.bin sg 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -qm "Signage sync"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
