<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e1420">
<title>MCCS Pulse · Hub + Strategic Events mockup (sample data)</title>
<style>
@font-face{font-family:"Newsreader";src:url(../newsreader.woff2) format("woff2");font-weight:300 700;font-style:normal;font-display:swap}
@font-face{font-family:"Newsreader";src:url(../newsreader-italic.woff2) format("woff2");font-weight:300 700;font-style:italic;font-display:swap}
:root{
 --txt:#eef1f6;--mut:rgba(238,241,246,.62);--mut2:rgba(238,241,246,.76);--line:rgba(255,255,255,.12);--line2:rgba(255,255,255,.2);--glow:#f3d9a4;
 --card:rgba(255,255,255,.055);--card2:rgba(14,20,32,.5);--good:#9ee6b4;--bad:#ffb0a8;--warn:#f3c860;
 --so:#f3a6b8;--we:#8fb4ff;--em:#c7b3ff;--sg:#9ee6b4;
 --sky:radial-gradient(120% 80% at 50% 110%,#c98f6b 0%,#6d5a7a 28%,#2b3352 55%,#0e1420 85%);
 --serif:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
 --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--txt);font-family:var(--sans);background:#0e1420;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
a{color:var(--glow);text-decoration:none}
:focus-visible{outline:2px solid var(--glow);outline-offset:3px;border-radius:8px}
.sky{position:fixed;inset:0;background:var(--sky);z-index:0}
.sky::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.06) 0 1px,transparent 2px) 0 0/90px 90px,radial-gradient(circle at 70% 40%,rgba(255,255,255,.05) 0 1px,transparent 2px) 0 0/130px 130px}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) clamp(16px,4vw,36px) calc(env(safe-area-inset-bottom) + 120px)}
@media(min-width:1100px){.wrap{max-width:min(1480px,94vw)}}
@media(min-width:1600px){.wrap{max-width:min(1800px,92vw)}}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--mut)}
.top .r{display:flex;gap:10px;align-items:center}
.mk{letter-spacing:.3px;text-transform:none;font-size:12.5px;padding:6px 12px;border-radius:999px;border:1px dashed color-mix(in srgb,var(--glow) 55%,transparent);color:var(--glow);white-space:nowrap}
.ibtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:var(--card);backdrop-filter:blur(8px);color:var(--txt)}

/* headings + atoms */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:22px 0 4px}
.ph h1{font-family:var(--serif);font-weight:400;font-size:clamp(32px,4vw,46px);letter-spacing:-.015em;margin:0;line-height:1.05}
.ph p{margin:6px 0 0;color:var(--mut2);font-size:15px;max-width:68ch;line-height:1.5}
h2{font-family:var(--serif);font-weight:400;font-size:clamp(20px,1.3vw,24px);margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;line-height:1.2}
h2 small,.hint{font-family:var(--sans);font-size:12.5px;color:var(--mut);font-weight:400;letter-spacing:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);min-width:0}
a.card,button.card{display:block;color:inherit;text-align:left;width:100%;transition:border-color .2s,transform .2s}
a.card:hover,button.card:hover{border-color:color-mix(in srgb,var(--glow) 45%,transparent)}
.up{color:var(--good)}.down{color:var(--bad)}.warn{color:var(--warn)}.mut{color:var(--mut)}.mut2{color:var(--mut2)}
.num{font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;color:var(--mut2);background:rgba(255,255,255,.03);white-space:nowrap}
.chip.on{border-color:var(--glow);color:var(--txt);background:color-mix(in srgb,var(--glow) 13%,transparent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:9px;padding:11px 18px;border-radius:999px;border:1px solid color-mix(in srgb,var(--glow) 60%,transparent);background:color-mix(in srgb,var(--glow) 12%,transparent);color:var(--txt);font-size:14px;white-space:nowrap}
.btn.ghost{border-color:var(--line);background:rgba(255,255,255,.04)}
.btn.sm{padding:7px 13px;font-size:13px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid;white-space:nowrap;line-height:1.5}
.badge.so{color:var(--so);border-color:color-mix(in srgb,var(--so) 50%,transparent)}
.badge.we{color:var(--we);border-color:color-mix(in srgb,var(--we) 50%,transparent)}
.badge.em{color:var(--em);border-color:color-mix(in srgb,var(--em) 50%,transparent)}
.badge.sg{color:var(--sg);border-color:color-mix(in srgb,var(--sg) 50%,transparent)}
.badge.n{color:var(--mut2);border-color:var(--line2)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:999px;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.up_{background:rgba(255,255,255,.08);color:var(--mut2)}
.st.pr{background:rgba(243,217,164,.15);color:var(--glow)}
.st.lv{background:rgba(158,230,180,.16);color:var(--good)}
.st.lv::before{box-shadow:0 0 0 3px rgba(158,230,180,.25);animation:pulse 2s ease-in-out infinite}
.st.wr{background:rgba(143,180,255,.14);color:#b7cdff}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(158,230,180,0)}}
.dots{display:inline-flex;gap:5px;align-items:center}
.dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid}
.dots i.so{border-color:var(--so)}.dots i.we{border-color:var(--we)}.dots i.em{border-color:var(--em)}.dots i.sg{border-color:var(--sg)}
.dots i.f.so{background:var(--so)}.dots i.f.we{background:var(--we)}.dots i.f.em{background:var(--em)}.dots i.f.sg{background:var(--sg)}
.dots i:not(.f){opacity:.7}
.lbl{font-size:13px;color:var(--mut2)}
.rule{height:1px;background:var(--line);margin:14px 0}

/* dock */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 18px);display:flex;gap:4px;padding:7px;border-radius:999px;background:rgba(14,20,32,.78);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:5}
.dock a{padding:11px 16px;border-radius:999px;font-size:14px;display:flex;gap:8px;align-items:center;color:var(--mut2);white-space:nowrap}
.dock a.on{color:var(--txt);background:rgba(255,255,255,.09)}
.dock a.main{color:var(--txt);background:color-mix(in srgb,var(--glow) 16%,transparent);border:1px solid color-mix(in srgb,var(--glow) 55%,transparent);margin-left:6px}
.dock .sep{width:1px;background:var(--line);margin:6px 4px}
.dock .ph-only{display:none}
.fade{position:fixed;left:0;right:0;bottom:0;height:120px;background:linear-gradient(to top,rgba(10,14,24,.8),rgba(10,14,24,0));pointer-events:none;z-index:4}
@media(max-width:699px){
 .dock .dk-only{display:none}.dock .ph-only{display:flex}
 .dock{gap:2px;padding:6px;width:calc(100% - 28px);max-width:380px;justify-content:space-between}
 .dock a{flex-direction:column;gap:3px;padding:8px 10px;font-size:11px;flex:1;justify-content:center}
 .dock a.main{margin-left:0}.dock .sep{display:none}
}

/* channel picker sheet (phone) */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.3s;z-index:6}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:rgba(14,20,32,.96);backdrop-filter:blur(18px);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom) + 26px);transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.8,.2,1);z-index:7}
.sheet.show{transform:none}
.sheet h3{font-family:var(--serif);font-weight:400;font-size:22px;margin:0 0 4px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.pick a{display:block;padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--txt)}
.pick a b{display:block;font-weight:250;font-size:26px;margin-top:6px}
.pick a small{font-size:12px;color:var(--mut)}

/* ---------- TODAY ---------- */
.live{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:16px 0 0;padding:11px 16px;border-radius:16px;border:1px solid rgba(158,230,180,.3);background:rgba(158,230,180,.07);color:var(--txt);font-size:14px}
.live b{font-weight:500}.live .go{margin-left:auto;color:var(--good);font-size:13.5px;white-space:nowrap}
.lead{display:grid;gap:14px;margin-top:14px}
.hero{text-align:center;padding:14px 0 6px}
.hero .eyebrow{font-family:var(--serif);font-style:italic;font-size:clamp(17px,1.4vw,21px);color:var(--mut2)}
.big{font-weight:200;font-size:clamp(68px,16vw,118px);letter-spacing:-1px;line-height:1.02;margin:6px 0 4px;text-shadow:0 0 60px color-mix(in srgb,var(--glow) 40%,transparent);font-variant-numeric:tabular-nums}
.hero .what{font-size:14px;color:var(--mut2)}
.delta{display:inline-block;margin-top:10px;padding:5px 12px;border-radius:999px;font-size:13px;border:1px solid var(--line)}
.blend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 12px;margin-top:14px;font-size:12.5px;color:var(--mut2)}
.blend span{white-space:nowrap}.blend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.blend .eq{color:var(--mut)}
.blendnote{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.45}
.range{display:flex;gap:6px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;overflow:hidden}
.tile .h{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--mut2)}
.tile .h .ci{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1px solid}
.tile .h .ci svg{width:14px;height:14px}
.tile .h .go{margin-left:auto;color:var(--mut);font-size:16px}
.tile .v{font-weight:250;font-size:clamp(30px,2.4vw,44px);margin:10px 0 2px;font-variant-numeric:tabular-nums;line-height:1.05}
.tile .l{font-size:12.5px;color:var(--mut2)}
.tile .d{font-size:12.5px;margin-top:4px}
.tile svg.sp{display:block;width:100%;height:42px;margin-top:10px}
.tile .x{font-size:12px;color:var(--mut);margin-top:6px;line-height:1.4}
.c-so .ci{color:var(--so);border-color:color-mix(in srgb,var(--so) 45%,transparent)}
.c-we .ci{color:var(--we);border-color:color-mix(in srgb,var(--we) 45%,transparent)}
.c-em .ci{color:var(--em);border-color:color-mix(in srgb,var(--em) 45%,transparent)}
.c-sg .ci{color:var(--sg);border-color:color-mix(in srgb,var(--sg) 45%,transparent)}
@media(min-width:1100px){
 .lead{grid-template-columns:minmax(0,4.2fr) minmax(0,7.8fr);align-items:center;column-gap:clamp(24px,3vw,56px)}
 .hero{text-align:left}.blend,.range{justify-content:flex-start}
 .big{font-size:clamp(84px,7vw,140px)}
}
@media(min-width:1600px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}.lead{grid-template-columns:minmax(0,3.6fr) minmax(0,8.4fr)}}

.evrow{display:grid;gap:14px;margin-top:16px}
@media(min-width:900px){.evrow{grid-template-columns:1fr 1fr}}
.ev .top2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ev .kind{font-size:13px;color:var(--mut2)}
.ev h3{font-family:var(--serif);font-weight:400;font-size:clamp(24px,1.9vw,32px);margin:8px 0 2px;letter-spacing:-.01em;line-height:1.1}
.ev .meta{font-size:13px;color:var(--mut)}
.ev .res{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap;margin:14px 0 6px}
.ev .res .bv{font-weight:200;font-size:clamp(46px,4vw,64px);line-height:1;font-variant-numeric:tabular-nums}
.ev .res .bl{font-size:13px;color:var(--mut2);margin-top:4px}
.ev .cmp{display:flex;flex-direction:column;gap:6px;font-size:13.5px;padding-bottom:4px}
.ev .cmp b{font-weight:500}
.goalbar{height:8px;border-radius:8px;background:rgba(255,255,255,.08);position:relative;margin:12px 0 4px;overflow:visible}
.goalbar span{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,color-mix(in srgb,var(--glow) 70%,transparent),var(--glow))}
.goalbar em{position:absolute;top:-5px;width:2px;height:18px;background:var(--txt);border-radius:2px}
.goalbar em::after{content:attr(data-l);position:absolute;top:20px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--mut2);font-style:normal;white-space:nowrap}
.chs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:22px}
.chs>div{padding:10px 11px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);min-width:0}
.chs .t{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut2)}
.chs .t i{width:8px;height:8px;border-radius:50%;flex:none}
.chs b{display:block;font-weight:300;font-size:20px;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chs small{display:block;font-size:11.5px;color:var(--mut);margin-top:2px;line-height:1.35}
.chs .miss{border-style:dashed;border-color:rgba(243,200,96,.5);background:rgba(243,200,96,.06)}
.chs .miss b{color:var(--warn);font-size:15px;margin-top:7px;white-space:normal}
.count{display:flex;align-items:baseline;gap:8px}
.count b{font-weight:200;font-size:clamp(46px,4vw,64px);line-height:1}
.pace{margin-top:14px}
.pace .row{display:flex;justify-content:space-between;font-size:13px;color:var(--mut2);margin-bottom:6px;gap:10px}
.pace .trk{position:relative;height:10px;border-radius:10px;background:rgba(255,255,255,.08)}
.pace .trk span{position:absolute;left:0;top:0;bottom:0;border-radius:10px;background:var(--glow)}
.pace .trk em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--txt)}
.ev .foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px;flex-wrap:wrap}

.bot{display:grid;gap:14px;margin-top:16px}
@media(min-width:1100px){.bot{grid-template-columns:minmax(0,2fr) minmax(0,1fr);align-items:start}}
.topc{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tc{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:rgba(255,255,255,.04);display:flex;flex-direction:column}
.thumb{aspect-ratio:16/10;position:relative;display:flex;align-items:flex-end;padding:10px;overflow:hidden}
.thumb .ttl{font-family:var(--serif);font-size:17px;line-height:1.15;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.5);position:relative}
.thumb .badge{position:absolute;top:9px;left:9px;background:rgba(14,20,32,.72);backdrop-filter:blur(6px)}
.thumb .evt{position:absolute;top:9px;right:9px;font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(243,217,164,.9);color:#1b1a22}
.tc .b{padding:11px 12px 13px}
.tc .t{font-size:14px;line-height:1.35}
.tc .m{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;gap:8px}
.tc .m b{font-weight:300;font-size:22px;font-variant-numeric:tabular-nums}
.tc .m span{font-size:12px;color:var(--mut)}
.att{display:flex;flex-direction:column}
.att a{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line);color:var(--txt)}
.att a:last-child{border:0}
.att .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2)}
.att .ic svg{width:15px;height:15px}
.att .t{font-size:14px;line-height:1.35}
.att .s{font-size:12.5px;color:var(--mut);margin-top:3px;line-height:1.4}
.att .go{font-size:12.5px;color:var(--glow);white-space:nowrap;padding-top:2px}

/* ---------- EVENTS LIST ---------- */
.evlayout{display:grid;gap:16px;margin-top:18px}
@media(min-width:1200px){.evlayout{grid-template-columns:minmax(0,1fr) 360px;align-items:start}}
.tl{position:relative;overflow-x:auto}
.tl .inner{min-width:820px;position:relative}
.tl .months{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--mut2)}
.tl .months div{padding:0 0 8px 8px;border-left:1px solid var(--line)}
.tl .lane{position:relative;height:34px;margin:6px 0}
.tl .lane .win{position:absolute;top:8px;height:18px;border-radius:9px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.tl .lane .win.pr{background:rgba(243,217,164,.14);border-color:rgba(243,217,164,.45)}
.tl .lane .win.wr{background:rgba(143,180,255,.12);border-color:rgba(143,180,255,.35)}
.tl .lane .win.lv{background:rgba(158,230,180,.14);border-color:rgba(158,230,180,.5)}
.tl .lane .day{position:absolute;top:4px;width:12px;height:26px;border-radius:5px;background:var(--txt);transform:translateX(-50%);box-shadow:0 0 14px rgba(255,255,255,.4)}
.tl .lane .nm{position:absolute;top:7px;font-size:13px;white-space:nowrap;padding-left:10px;color:var(--txt)}
.tl .today{position:absolute;top:0;bottom:0;width:0;border-left:1.5px dashed var(--glow);z-index:2}
.tl .today span{position:absolute;top:-2px;left:6px;font-size:11.5px;color:var(--glow);white-space:nowrap}
.tl .key{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--mut2);margin-top:10px}
.tl .key i{display:inline-block;width:18px;height:10px;border-radius:5px;margin-right:6px;vertical-align:-1px;border:1px solid var(--line2)}
.evtable{width:100%;border-collapse:collapse;font-size:14px}
.evtable th{font-weight:400;font-size:12.5px;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.evtable td{padding:13px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.evtable tr:last-child td{border-bottom:0}
.evtable tr.tap{cursor:pointer}.evtable tr.tap:hover td{background:rgba(255,255,255,.035)}
.evtable .nm{font-family:var(--serif);font-size:18px;line-height:1.2}
.evtable .sub{font-size:12.5px;color:var(--mut);margin-top:2px}
.evtable .r{text-align:right;font-variant-numeric:tabular-nums}
.evtable .big2{font-weight:300;font-size:19px}
.mini{height:6px;width:90px;border-radius:6px;background:rgba(255,255,255,.08);display:inline-block;vertical-align:middle;margin-right:8px;overflow:hidden}
.mini span{display:block;height:100%;background:var(--glow);border-radius:6px}
.scroll{overflow-x:auto}
.side{display:flex;flex-direction:column;gap:14px}
.src{display:flex;gap:12px;align-items:flex-start}
.src .gs{width:40px;height:40px;border-radius:10px;background:#1e8e5a;display:grid;place-items:center;flex:none}
.src .gs svg{width:22px;height:22px;stroke:#fff}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--mut2);margin-top:12px}
.flow span{padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.ideas ol{margin:0;padding:0;list-style:none;counter-reset:i}
.ideas li{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.45;color:var(--mut2)}
.ideas li:last-child{border:0}

function chart(){
 // Sep 24 .. Nov 1 = 39 days, event Oct 24-25 = idx 30,31
 const n=39,r=rng(7),W=1000,H=260,pad=58;
 const so=[],we=[],em=[];
 for(let i=0;i<n;i++){const ramp=i<30?Math.pow(i/30,1.6):(i<32?1.25:Math.max(.12,1-(i-31)*.16));so.push(1200+9800*ramp+r()*1500);we.push(150+1250*ramp*(i>=29&&i<=31?1.9:1)+r()*200);em.push(([8,22,29].includes(i)?2800:([9,23,30].includes(i)?1300:120))+r()*80)}
 const tot=so.map((v,i)=>v+we[i]+em[i]);const mx=Math.ceil(Math.max(...tot)/5000)*5000;
 const bw=(W-pad)/n;let bars='';
 for(let i=0;i<n;i++){let y=H-24;const x=pad+i*bw+1.5;[[em[i],C.em],[we[i],C.we],[so[i],C.so]].forEach(([v,c])=>{const h=v/mx*(H-40);y-=h;bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-3).toFixed(1)}" height="${h.toFixed(1)}" fill="${c}" opacity=".85" rx="1.5"/>`})}
 let grid='';for(let g=0;g<=mx;g+=5000){const y=H-24-g/mx*(H-40);grid+=`<line x1="${pad}" x2="${W}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.08)"/><text x="${pad-6}" y="${y+4}" text-anchor="end" font-size="11" fill="rgba(238,241,246,.6)">${g/1000}K</text>`}
 const ex=pad+30*bw;
 const lab=[[0,'Sep 24'],[7,'Oct 1'],[14,'Oct 8'],[21,'Oct 15'],[28,'Oct 22'],[35,'Oct 29']].map(([i,t])=>`<text x="${pad+i*bw+bw/2}" y="${H-6}" font-size="11" fill="rgba(238,241,246,.6)" text-anchor="middle">${t}</text>`).join('');
 // signage lane
 const sgx1=pad+7*bw,sgx2=pad+32*bw,sgx3=pad+18*bw,sgx4=pad+30*bw;
 const lane=`<svg class="chart" viewBox="0 0 ${W} 54" style="margin-top:2px">
  <text x="${pad-6}" y="18" text-anchor="end" font-size="11" fill="rgba(238,241,246,.6)">Slide 1</text><rect x="${sgx1}" y="8" width="${sgx2-sgx1}" height="14" rx="7" fill="${C.sg}" opacity=".75"/><text x="${sgx1+8}" y="19" font-size="11" fill="#0e1420">18 screens · Oct 1–25</text>
  <text x="${pad-6}" y="42" text-anchor="end" font-size="11" fill="rgba(238,241,246,.6)">Slide 2</text><rect x="${sgx3}" y="32" width="${sgx4-sgx3}" height="14" rx="7" fill="${C.sg}" opacity=".5"/><text x="${sgx3+8}" y="43" font-size="11" fill="#0e1420">9 screens · Oct 12–23</text>
  <line x1="${ex}" x2="${ex}" y1="0" y2="54" stroke="#eef1f6" stroke-dasharray="3 3"/></svg>`;
 return `<svg class="chart" viewBox="0 0 ${W} ${H}">${grid}<rect x="${ex}" y="10" width="${bw*2}" height="${H-34}" fill="rgba(255,255,255,.07)"/>${bars}<line x1="${ex}" x2="${ex}" y1="6" y2="${H-24}" stroke="#eef1f6" stroke-dasharray="3 3"/><text x="${ex+bw*2+6}" y="20" font-size="12" fill="#eef1f6">Event weekend</text>${lab}</svg>${lane}`}

/* =================== SETUP + REVIEW =================== */
function setup(){
 const q=(k,ch,t,s,why,ev,conf,col)=>`<div class="qi"><div class="th">${sq(k)}</div><div><div class="t">${t}</div><div class="s"><span class="badge ${ch}">${CH[ch]}</span>${s}${why.map(w=>`<span class="why">${w}</span>`).join('')}</div>
  <div class="sug"><span class="to">→ <b>${ev}</b></span><span class="conf"><span class="cbar"><span style="width:${conf}%;background:${col}"></span></span>${conf}% match</span><div class="acts"><button class="ok">${ic('check',13)} Link</button><button class="no">Not this</button><button class="no">Other event…</button></div></div></div></div>`;
 return `${topbar()}
 <a class="back" href="#events">${ic('back',15)}Strategic events</a>
 <div class="ph"><div><h1>Event setup &amp; matching</h1><p>Each event carries a few rules. Pulse proposes links every night; you confirm the unsure ones once and they stay linked.</p></div>
 <div class="tabs"><b class="on">Review matches · 7</b><b>Event setup</b><b>Sheet</b></div></div>
 <div class="sgrid">
  <div class="card q">
   <h2>Review matches <small>7 waiting · 12 linked automatically today</small></h2>
   ${q('hw','so','Costume contest winners!','IG post · Oct 26',['“costume”','date window'],'Halloween Weekend',64,'var(--warn)')}
   ${q('park','so','Fieldhouse closed Saturday for special event','FB post · Oct 22',['date window','“Fieldhouse”'],'Okinawa Comic Con',58,'var(--warn)')}
   ${q('mail','em','Story: Ball gown &amp; tux rental deals','Oct 28 newsletter',['alias “ball gown”'],'Marine Corps Birthday Ball',82,'var(--glow)')}
   ${q('tt','so','Gobble wobble fun run photos','FB album · Oct 29',['alias “gobble”'],'Thanksgiving Turkey Trot 5K',61,'var(--warn)')}
   ${q('web','we','/events/fall-weekend','Web page · 1.2K users',['date window only'],'Halloween Weekend',47,'var(--bad)')}
   ${q('cc2','so','Superhero 5K recap','IG post · Oct 27',['alias “superhero”'],'Okinawa Comic Con',52,'var(--warn)')}
   ${q('tree','sg','Slide: Holiday lights on Foster','2 screens · from Oct 29',['“holiday lights”'],'Christmas Tree Lighting',55,'var(--warn)')}
   <div class="pnote"><b style="color:var(--txt);font-weight:500">How sure is sure?</b> 90% and up links automatically (you can still unlink). 50–89% waits here. Below 50% is only shown when nothing better exists. Your answers are remembered: "Not this" never comes back.</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
   <div class="card">
    <h2>Christmas Tree Lighting <small>new · from the sheet</small></h2>
    <div class="f2"><label class="fld"><span>Event name</span><div class="inp">Christmas Tree Lighting</div></label><label class="fld"><span>Program</span><div class="inp">Recreation · Special Events</div></label></div>
    <div class="f3"><label class="fld"><span>Event date(s)</span><div class="inp">Fri, Dec 4</div></label><label class="fld"><span>Promote from</span><div class="inp">30 days before</div><div class="help">Nov 4</div></label><label class="fld"><span>Keep counting</span><div class="inp">7 days after</div><div class="help">Dec 11</div></label></div>
    <label class="fld"><span>Keywords &amp; aliases</span><div class="inp"><span class="tok">tree lighting</span><span class="tok">christmas tree</span><span class="tok">holiday lights</span><span class="tok">santa</span><span class="add">+ add</span></div><div class="help">Matched in post text, newsletter story titles and slide names. Not case-sensitive.</div></label>
    <div class="f2"><label class="fld"><span>Hashtags</span><div class="inp"><span class="tok">#FosterTreeLighting</span><span class="add">+ add</span></div></label><label class="fld"><span>Web paths</span><div class="inp"><span class="tok">/tree-lighting</span><span class="tok">/holiday/*</span></div></label></div>
    <div class="f2"><label class="fld"><span>Signage playlist (optional)</span><div class="inp"><span class="tok">Holiday 2026</span></div></label><label class="fld"><span>Compare with</span><div class="inp">Christmas Tree Lighting 2025</div></label></div>
    <div class="f3"><label class="fld"><span>Goal · touchpoints</span><div class="inp">200,000</div></label><label class="fld"><span>Goal · web users</span><div class="inp">12,000</div></label><label class="fld"><span>Goal · story clicks</span><div class="inp">1,500</div></label></div>
    <div class="help">Only name and date are required. Everything else makes matching sharper.</div>
   </div>
   <div class="card">
    <h2>Matching rules <small>applied in this order</small></h2>
    <ol class="rulelist">
     <li><b>Inside the campaign window</b> (promo start → after-days). Anything outside is never matched.</li>
     <li><b>Exact signals</b>: a web page under the event's path, a post or story linking to that path, a listed hashtag. Score 95–99%.</li>
     <li><b>Keywords and aliases</b> in post text, story title or slide name. Score 80–97%, lower for short or common words.</li>
     <li><b>Weak signals</b>: date window only, or a venue name. Score under 60%, always sent to review.</li>
     <li><b>Two events fit?</b> The higher score wins the suggestion; both are shown in review.</li>
     <li><b>By hand</b> always wins, and survives every nightly rebuild.</li>
    </ol>
   </div>
   <div class="card">
    <h2>The sheet <small>Google Sheets · you edit, Pulse reads</small></h2>
    <div class="scroll"><table class="sheetprev"><thead><tr><th>id</th><th>name</th><th>start</th><th>end</th><th>promo_days</th><th>after_days</th><th>keywords</th><th>hashtags</th><th>url_paths</th><th>goal</th><th>prior_year</th></tr></thead>
     <tbody><tr><td>comic-con-26</td><td>Okinawa Comic Con</td><td>2026-10-24</td><td>2026-10-25</td><td>30</td><td>7</td><td>comic con; cosplay</td><td>#OkiComicCon</td><td>/comic-con</td><td>220000</td><td>comic-con-25</td></tr>
     <tr><td>ball-26</td><td>Marine Corps Birthday Ball</td><td>2026-11-10</td><td>2026-11-10</td><td>30</td><td>7</td><td>birthday ball; ball gown</td><td></td><td>/birthday-ball</td><td>175000</td><td>ball-25</td></tr>
     <tr><td>tree-26</td><td>Christmas Tree Lighting</td><td>2026-12-04</td><td>2026-12-04</td><td>30</td><td>7</td><td>tree lighting; santa</td><td>#FosterTreeLighting</td><td>/tree-lighting</td><td>200000</td><td>tree-25</td></tr></tbody></table></div>
    <div class="help" style="margin-top:8px">Confirmed and unlinked matches are saved in a second tab ("links") so your decisions travel with the sheet.</div>
   </div>
  </div>
 </div>`}

   list:[['mail','Story: Comic Con is back','Oct 16 issue','1,140','Comic Con'],['mail','Story: Your weekend guide','Oct 23 issue','812','Comic Con'],['mail','Story: Haunted trail tickets','Oct 23 issue','706','Halloween'],['mail','Story: Ball gown & tux deals','Oct 28 issue','388','Birthday Ball'],['mail','Story: New gym hours','Oct 9 issue','214','']]},

   list:[['tt','Turkey Trot: register now','14 screens · 9 days','126','Turkey Trot'],['hw','Haunted trail this weekend','22 screens · 18 days','396','Halloween'],['cc2','Comic Con · Oct 24–25','18 screens · 25 days','412','Comic Con'],['tree','Holiday lights on Foster','2 screens · 2 days','4','?'],['park','Gate hours reminder','40 screens · 30 days','1,200','']]}
 }[v];
 const unit={social:'views',web:'views',email:'clicks',signage:'screen-days'}[v];

 <div class="evfilter">Filter by event: <span class="chip on">All</span><span class="chip">Comic Con</span><span class="chip">Halloween</span><span class="chip">Birthday Ball</span><span class="chip">Turkey Trot</span><span class="chip">Not linked</span></div>

   ${K.list.map(([k,t,s,n,e])=>`<div class="p"><div class="th">${sq(k)}</div><div><div class="t">${t}</div><div class="s"><span class="badge ${ch}">${K.t}</span>${s}${e?(e==='?'?`<span class="why" style="color:var(--warn)">possible match · review</span>`:`<span class="why">${ic('flag',11)}${e}</span>`):`<span class="why">no event</span>`}</div></div><div class="n"><b>${n}</b><span>${unit}</span></div></div>`).join('')}

/* =================== ROUTER =================== */
function render(){let h=(location.hash||'#today').slice(1);let html;
 if(h==='today')html=today();else if(h==='events')html=events();else if(h.startsWith('event/'))html=detail(h.split('/')[1]);else if(h==='setup')html=setup();
 else if(['social','web','email','signage'].includes(h))html=chan(h);else{h='today';html=today()}
 document.getElementById('app').innerHTML=html;document.getElementById('dock').innerHTML=dock(h);window.scrollTo(0,0)}
addEventListener('hashchange',render);render();
</script>
