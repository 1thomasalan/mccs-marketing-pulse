<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e1420">
<title>MCCS Pulse · Programs mockup (sample data)</title>
<style>
@font-face{font-family:"Newsreader";src:url(../newsreader.woff2) format("woff2");font-weight:300 700;font-style:normal;font-display:swap}
@font-face{font-family:"Newsreader";src:url(../newsreader-italic.woff2) format("woff2");font-weight:300 700;font-style:italic;font-display:swap}
:root{
 --txt:#eef1f6;--mut:rgba(238,241,246,.62);--mut2:rgba(238,241,246,.76);--line:rgba(255,255,255,.12);--line2:rgba(255,255,255,.2);--glow:#f3d9a4;
 --card:rgba(255,255,255,.055);--card2:rgba(14,20,32,.5);--good:#9ee6b4;--bad:#ffb0a8;--warn:#f3c860;
 --so:#f3a6b8;--we:#8fb4ff;--em:#c7b3ff;--sg:#9ee6b4;
 --sky:radial-gradient(120% 80% at 50% 110%,#c98f6b 0%,#6d5a7a 28%,#2b3352 55%,#0e1420 85%);
 --serif:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
 --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--txt);font-family:var(--sans);background:#0e1420;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
a{color:var(--glow);text-decoration:none}
:focus-visible{outline:2px solid var(--glow);outline-offset:3px;border-radius:8px}
.sky{position:fixed;inset:0;background:var(--sky);z-index:0}
.sky::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.06) 0 1px,transparent 2px) 0 0/90px 90px,radial-gradient(circle at 70% 40%,rgba(255,255,255,.05) 0 1px,transparent 2px) 0 0/130px 130px}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) clamp(16px,4vw,36px) calc(env(safe-area-inset-bottom) + 120px)}
@media(min-width:1100px){.wrap{max-width:min(1480px,94vw)}}
@media(min-width:1600px){.wrap{max-width:min(1800px,92vw)}}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--mut)}
.top .r{display:flex;gap:10px;align-items:center}
.mk{letter-spacing:.3px;text-transform:none;font-size:12.5px;padding:6px 12px;border-radius:999px;border:1px dashed color-mix(in srgb,var(--glow) 55%,transparent);color:var(--glow);white-space:nowrap}
.ibtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:var(--card);backdrop-filter:blur(8px);color:var(--txt)}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:22px 0 4px}
.ph h1{font-family:var(--serif);font-weight:400;font-size:clamp(32px,4vw,46px);letter-spacing:-.015em;margin:0;line-height:1.05}
.ph p{margin:6px 0 0;color:var(--mut2);font-size:15px;max-width:68ch;line-height:1.5}
h2{font-family:var(--serif);font-weight:400;font-size:clamp(20px,1.3vw,24px);margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;line-height:1.2}
h2 small{font-family:var(--sans);font-size:12.5px;color:var(--mut);font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);min-width:0}
.up{color:var(--good)}.down{color:var(--bad)}.warn{color:var(--warn)}.mut{color:var(--mut)}.mut2{color:var(--mut2)}
.num{font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;color:var(--mut2);background:rgba(255,255,255,.03);white-space:nowrap}
.chip.on{border-color:var(--glow);color:var(--txt);background:color-mix(in srgb,var(--glow) 13%,transparent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:9px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:13.5px;white-space:nowrap}
.flag{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:999px;white-space:nowrap}
.flag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.flag.g{background:rgba(158,230,180,.14);color:var(--good)}.flag.w{background:rgba(243,200,96,.15);color:var(--warn)}.flag.b{background:rgba(255,176,168,.15);color:var(--bad)}.flag.s{background:rgba(143,180,255,.14);color:#b7cdff}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 18px);display:flex;gap:4px;padding:7px;border-radius:999px;background:rgba(14,20,32,.78);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:5}
.dock a{padding:11px 16px;border-radius:999px;font-size:14px;display:flex;gap:8px;align-items:center;color:var(--mut2);white-space:nowrap}
.dock a.on{color:var(--txt);background:rgba(255,255,255,.09)}
.dock a.main{color:var(--txt);background:color-mix(in srgb,var(--glow) 16%,transparent);border:1px solid color-mix(in srgb,var(--glow) 55%,transparent);margin-left:6px}
.dock .sep{width:1px;background:var(--line);margin:6px 4px}
.dock .ph-only{display:none}
.dock a.new{position:relative}.dock a.new::after{content:"new";position:absolute;top:-9px;right:-2px;font-size:9.5px;letter-spacing:.5px;padding:1px 6px;border-radius:999px;background:var(--glow);color:#1a1a1a}
.fade{position:fixed;left:0;right:0;bottom:0;height:120px;background:linear-gradient(to top,rgba(10,14,24,.8),rgba(10,14,24,0));pointer-events:none;z-index:4}

/* list page */
.kg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}
.kg .l{font-size:12.5px;color:var(--mut);letter-spacing:.3px}
.kg .v{font-family:var(--serif);font-size:38px;line-height:1.1;margin:4px 0}
.kg .v small{font-size:18px;color:var(--mut)}
.kg .d{font-size:12.5px}
.tools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:6px 0 14px}
.srch{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--mut);min-width:240px;font-size:14px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--mut2);flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ptab{width:100%;border-collapse:separate;border-spacing:0}
.ptab th{font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);font-weight:500;text-align:left;padding:0 12px 10px;white-space:nowrap}
.ptab th.r,.ptab td.r{text-align:right}
.ptab td{padding:13px 12px;border-top:1px solid var(--line);vertical-align:middle;font-size:14px}
.ptab tr.row{cursor:pointer}.ptab tr.row:hover td{background:rgba(255,255,255,.035)}
.ptab td b{font-weight:600}
.pn b{display:block;font-size:15px}.pn small{color:var(--mut);font-size:12.5px}
.cv{font-variant-numeric:tabular-nums;white-space:nowrap}.cv small{display:block;color:var(--mut);font-size:11.5px}
.cv.z{color:var(--mut);opacity:.6}
.mix{display:flex;height:8px;border-radius:5px;overflow:hidden;width:120px;background:rgba(255,255,255,.06)}
.mix span{height:100%}
.spk{width:96px;height:28px}
.dot4{display:flex;gap:6px}
.dot4 span{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:10.5px;font-weight:600;color:#0e1420}
.dot4 span.off{background:transparent!important;border:1px dashed var(--line2);color:var(--mut)}
.pcards{display:none}
.branchh td{padding:18px 12px 8px;border-top:0;font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--glow)}

/* detail */
.back{display:inline-flex;align-items:center;gap:8px;color:var(--mut2);font-size:14px;margin-top:18px}
.dhero{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin:14px 0 16px}
.dhero .big{font-family:var(--serif);font-size:58px;line-height:1;margin:10px 0 4px}
.dhero .sub{color:var(--mut2);font-size:14px;line-height:1.5}
.chan4{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.ct{border-radius:18px;padding:14px 16px;border:1px solid var(--line);background:rgba(255,255,255,.035)}
.ct .l{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut2)}
.ct .l i{width:9px;height:9px;border-radius:3px}
.ct .v{font-family:var(--serif);font-size:30px;margin:6px 0 2px}
.ct .d{font-size:12px}
.dgrid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.chart{width:100%;height:auto;display:block}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.item{display:grid;grid-template-columns:54px 1fr auto;gap:14px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.thumb{width:54px;height:54px;border-radius:12px;display:grid;place-items:center;font-size:11px;color:#0e1420;font-weight:600}
.item b{display:block;font-size:14.5px;font-weight:500;line-height:1.35}
.item small{color:var(--mut);font-size:12.5px}
.item .m{text-align:right;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.item .m small{display:block}
.gap{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.45}
.gap:first-of-type{border-top:0}
.gap .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;background:rgba(243,200,96,.14);color:var(--warn)}
.gap .ic.ok{background:rgba(158,230,180,.14);color:var(--good)}
.evrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.evrow:first-of-type{border-top:0}
.side{display:flex;flex-direction:column;gap:16px}
.note{margin:28px 0 0;padding:16px 20px;border:1px dashed var(--line2);border-radius:18px;color:var(--mut2);font-size:13.5px;line-height:1.6}

@media(max-width:1099px){.dgrid,.dhero{grid-template-columns:1fr}}
@media(max-width:699px){
 .dock .dk-only{display:none}.dock .ph-only{display:flex}
 .dock{gap:2px;padding:6px;width:calc(100% - 28px);max-width:400px;justify-content:space-between}
 .dock a{flex-direction:column;gap:3px;padding:8px 6px;font-size:11px;flex:1;justify-content:center}
 .dock a.main{margin-left:0}.dock .sep{display:none}
 .kg{grid-template-columns:1fr 1fr;gap:10px}.kg .v{font-size:30px}
 .ptab{display:none}.pcards{display:block}
 .srch{min-width:0;flex:1}
 .legend.hd{display:none}
 .dhero .big{font-size:46px}
 .pc{display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px}
 .pc .t{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
 .pc .t b{font-size:15.5px;display:block}.pc .t small{color:var(--mut);font-size:12.5px}
 .pc .nums{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px;font-size:13px}
 .pc .nums div small{display:block;font-size:10.5px;color:var(--mut);letter-spacing:.3px}
 .pc .nums div.z{opacity:.45}
 .pc .ft{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--mut)}
 .chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
 .item{grid-template-columns:44px 1fr auto}.thumb{width:44px;height:44px}
}
</style>
</head>
<body>
<div class="sky"></div>
<div class="wrap" id="app"></div>
<div class="fade"></div>
<nav class="dock" id="dock"></nav>
<script>
const I={
 today:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
 social:'<svg class="i" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
 web:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
 email:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
 sign:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',
 ev:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
 prog:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>',
 rep:'<svg class="i" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg>',
 chan:'<svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
 search:'<svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
 gear:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
 back:'<svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
 warn:'<svg class="i" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
 ok:'<svg class="i" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>'
};
const C={so:'#f3a6b8',we:'#8fb4ff',em:'#c7b3ff',sg:'#9ee6b4'};
// SAMPLE DATA ONLY. Invented numbers. Real page reads the encrypted Programs tab + all channels.
const P=[
 {id:'sf',n:'Semper Fit Fitness',b:'Semper Fit',so:[48200,22],we:[6120,'/fitness'],em:[3,41],sg:[4,'4 slides'],ev:['Kinser Triathlon','Moved'],tr:[3,4,5,4,6,7,6,8],f:['g','Strong across all four']},
 {id:'ttc',n:'Tours+',b:'Marine & Family',so:[31900,14],we:[8840,'/tours'],em:[2,48],sg:[2,'2 slides'],ev:['Winter Tours launch','Dec 1'],tr:[4,5,4,6,5,6,7,7],f:['g','Healthy']},
 {id:'lib',n:'Libraries',b:'Marine & Family',so:[9400,9],we:[1210,'/libraries'],em:[1,39],sg:[0,''],ev:['Comic Con','Dec 6'],tr:[3,3,2,3,4,3,5,6],f:['w','No slide for Comic Con']},
 {id:'kc',n:'Kinser Club',b:'Food & Beverage',so:[12800,7],we:[640,'/clubs'],em:[0,0],sg:[3,'3 slides'],ev:['',''],tr:[5,4,4,3,3,2,2,2],f:['w','Social down 38%']},
 {id:'bowl',n:'Bowling Centers',b:'Semper Fit',so:[7300,6],we:[980,'/bowling'],em:[1,35],sg:[1,'1 slide'],ev:['Glow Bowl Nights','Nov 14'],tr:[2,3,3,3,4,3,4,4],f:['g','Healthy']},
 {id:'golf',n:'Taiyo Golf Course',b:'Business Ops',so:[5100,4],we:[2210,'/golf'],em:[0,0],sg:[1,'1 slide'],ev:['Turkey Shoot Scramble','Nov 21'],tr:[3,3,2,2,2,1,2,2],f:['w','No email in 90 days']},
 {id:'ccc',n:'Child & Youth Programs',b:'Marine & Family',so:[22600,11],we:[4300,'/cyp'],em:[2,52],sg:[2,'2 slides'],ev:['',''],tr:[4,4,5,5,5,6,6,6],f:['g','Healthy']},
 {id:'ega',n:'Exchange Grand Openings',b:'Retail',so:[0,0],we:[310,'/retail'],em:[0,0],sg:[0,''],ev:['',''],tr:[1,1,0,0,0,0,0,0],f:['b','Silent 188 days']},
 {id:'lodge',n:'Lodging',b:'Business Ops',so:[0,0],we:[1980,'/lodging'],em:[0,0],sg:[1,'1 slide'],ev:['',''],tr:[1,0,1,0,0,0,0,0],f:['b','No posts 168 days']},
 {id:'fest',n:'Festivals',b:'Marketing',so:[64300,18],we:[11400,'/festivals'],em:[2,57],sg:[3,'3 slides'],ev:['Oktoberfest','Wrapped Oct 18'],tr:[1,2,3,7,9,8,4,2],f:['s','Seasonal: judged by events']},
 {id:'auto',n:'Auto Skills Center',b:'Semper Fit',so:[2100,3],we:[720,'/auto'],em:[0,0],sg:[0,''],ev:['',''],tr:[2,2,1,2,1,1,1,1],f:['w','Only 1 channel active']},
 {id:'ss',n:'Service Stations',b:'Retail',so:[0,0],we:[160,'/gas'],em:[0,0],sg:[0,''],ev:['',''],tr:[0,0,0,0,0,0,0,0],f:['b','Silent 214 days']}
];
const nf=n=>n>=10000?(n/1000).toFixed(n>=100000?0:1).replace(/\.0$/,'')+'k':n.toLocaleString('en-US');
let view=location.hash.slice(1)||'list';

function dock(){const ph=innerWidth<700;const D=ph?[['today','Today',I.today],['ch','Channels',I.chan],['ev','Events',I.ev],['prog','Programs',I.prog],['rep','Report',I.rep]]:[['today','Today',I.today],['so','Social',I.social],['we','Web',I.web],['em','Email',I.email],['sg','Signage',I.sign],['ev','Events',I.ev],['prog','Programs',I.prog]];
 document.getElementById('dock').innerHTML=D.map(([k,l,i])=>`<a href="#list" class="${k==='prog'?'on new':''}">${i}<span>${l}</span></a>`).join('')+(ph?'':`<span class="sep"></span><a class="main" href="#list">${I.rep}<span>Report</span></a>`)}
function spark(a,w=96,h=28){const mx=Math.max(1,...a);const pts=a.map((v,i)=>[i/(a.length-1)*w,h-3-(v/mx)*(h-6)]);const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');const up=a[a.length-1]>=a[0];return `<svg class="spk" viewBox="0 0 ${w} ${h}"><path d="${d}" fill="none" stroke="${a.every(v=>!v)?'rgba(255,255,255,.25)':up?'var(--good)':'var(--bad)'}" stroke-width="1.8" stroke-linecap="round"/></svg>`}
function dots(p){return `<div class="dot4">${[['so','S',p.so[1]],['we','W',p.we[0]>500],['em','E',p.em[0]],['sg','D',p.sg[0]]].map(([k,l,on])=>`<span class="${on?'':'off'}" style="background:${C[k]}">${l}</span>`).join('')}</div>`}
function topbar(){return `<div class="top"><span>MCCS Pulse</span><span class="r"><span class="mk">Mockup · sample data</span><button class="ibtn">${I.search}</button><button class="ibtn">${I.gear}</button></span></div>`}

function list(){
 const active=P.filter(p=>[p.so[1],p.we[0]>500,p.em[0],p.sg[0]].filter(Boolean).length>=2).length;
 const branches=[...new Set(P.map(p=>p.b))];
 const rows=branches.map(b=>`<tr class="branchh"><td colspan="9">${b}</td></tr>`+P.filter(p=>p.b===b).map(p=>`<tr class="row" onclick="go('${p.id}')">
  <td class="pn"><b>${p.n}</b><small>${p.ev[0]?`Next: ${p.ev[0]} · ${p.ev[1]}`:'No event linked'}</small></td>
  <td>${dots(p)}</td>
  <td class="r cv ${p.so[1]?'':'z'}">${p.so[1]?nf(p.so[0]):'—'}<small>${p.so[1]} posts</small></td>
  <td class="r cv ${p.we[0]>500?'':'z'}">${nf(p.we[0])}<small>users</small></td>
  <td class="r cv ${p.em[0]?'':'z'}">${p.em[0]||'—'}<small>${p.em[0]?p.em[1]+'% open':'campaigns'}</small></td>
  <td class="r cv ${p.sg[0]?'':'z'}">${p.sg[0]||'—'}<small>${p.sg[0]?'in rotation':'slides'}</small></td>
  <td>${spark(p.tr)}</td>
  <td><span class="flag ${p.f[0]}">${p.f[1]}</span></td></tr>`).join('')).join('');
 const cards=P.map(p=>`<button class="card pc" onclick="go('${p.id}')"><div class="t"><span><b>${p.n}</b><small>${p.b}</small></span>${spark(p.tr,70,24)}</div>
  <div class="nums"><div class="${p.so[1]?'':'z'}" style="color:${C.so}"><small>SOCIAL</small>${p.so[1]?nf(p.so[0]):'—'}</div><div class="${p.we[0]>500?'':'z'}" style="color:${C.we}"><small>WEB</small>${nf(p.we[0])}</div><div class="${p.em[0]?'':'z'}" style="color:${C.em}"><small>EMAIL</small>${p.em[0]||'—'}</div><div class="${p.sg[0]?'':'z'}" style="color:${C.sg}"><small>SLIDES</small>${p.sg[0]||'—'}</div></div>
  <div class="ft"><span class="flag ${p.f[0]}">${p.f[1]}</span><span>${p.ev[0]?p.ev[0]+' · '+p.ev[1]:''}</span></div></button>`).join('');
 return topbar()+`<div class="ph"><div><h1>Programs</h1><p>How each program is doing across social, web, email and signage, and everything tied to it.</p></div><div class="chips"><span class="chip">7 days</span><span class="chip on">30 days</span><span class="chip">90 days</span><span class="chip">YTD</span></div></div>
 <div class="kg">
  <div class="card"><div class="l">Programs on 2+ channels</div><div class="v">${active}<small> / ${P.length}</small></div><div class="d mut">last 30 days</div></div>
  <div class="card"><div class="l">Need attention</div><div class="v warn">${P.filter(p=>p.f[0]!=='g'&&p.f[0]!=='s').length}</div><div class="d mut">silent, falling or one channel</div></div>
  <div class="card"><div class="l">No slide in rotation</div><div class="v">${P.filter(p=>!p.sg[0]).length}</div><div class="d mut">programs missing from signage</div></div>
  <div class="card"><div class="l">Events in next 30 days</div><div class="v">5</div><div class="d mut">1 without a slide</div></div>
 </div>
 <div class="tools"><div class="chips scroll"><span class="chip on">All branches</span>${branches.map(b=>`<span class="chip">${b}</span>`).join('')}</div>
  <div style="display:flex;gap:10px;align-items:center;flex:1;justify-content:flex-end"><span class="srch">${I.search}Find a program</span><span class="btn">Sort: Needs attention ▾</span></div></div>
 <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap"><h2 style="margin:0">Every program <small>tap a row for the full picture</small></h2><div class="legend hd"><span><i style="background:${C.so}"></i>Social views</span><span><i style="background:${C.we}"></i>Web users</span><span><i style="background:${C.em}"></i>Email campaigns</span><span><i style="background:${C.sg}"></i>Slides</span></div></div>
 <table class="ptab"><thead><tr><th>Program</th><th>Channels</th><th class="r">Social</th><th class="r">Web</th><th class="r">Email</th><th class="r">Signage</th><th>8-week trend</th><th>Health</th></tr></thead><tbody>${rows}</tbody></table>
 <div class="pcards">${cards}</div></div>
 <div class="note"><b>How the numbers connect.</b> Social = posts on the program's own page plus mentions on shared pages. Web = pages under the program's paths in the Programs tab. Email = campaigns whose title or links name the program. Signage = slides whose name matches the program. Events = events linked to the program in the Strategic Events sheet. Anything matched by keyword alone shows a "suggested" tag you can confirm or reject.</div>`}

function chart(){const W=760,H=220,n=30;const s=(f)=>Array.from({length:n},(_,i)=>f(i));
 const so=s(i=>1100+700*Math.sin(i/3)+(i==9||i==10?2600:0)+(i>20?400:0)),we=s(i=>150+60*Math.cos(i/4)+(i==10?380:0)),em=[4,18],ev=[9,10];
 const mx=Math.max(...so)*1.1;const x=i=>40+i/(n-1)*(W-60),y=v=>H-28-v/mx*(H-48);
 const line=(a,k,sc=1)=>`<path d="${a.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v*sc).toFixed(1)).join(' ')}" fill="none" stroke="${C[k]}" stroke-width="2.2" stroke-linecap="round"/>`;
 return `<svg class="chart" viewBox="0 0 ${W} ${H}">
 <rect x="${x(ev[0])-6}" y="10" width="${x(ev[1])-x(ev[0])+12}" height="${H-38}" rx="6" fill="rgba(243,217,164,.1)"/>
 <text x="${x(ev[0])-4}" y="24" fill="var(--glow)" font-size="11">Event weekend</text>
 ${[0,1,2,3].map(g=>`<line x1="40" x2="${W-20}" y1="${y(mx/4*g)}" y2="${y(mx/4*g)}" stroke="rgba(255,255,255,.07)"/>`).join('')}
 <rect x="40" y="${H-20}" width="${W-60}" height="6" rx="3" fill="rgba(158,230,180,.12)"/><rect x="${x(2)}" y="${H-20}" width="${x(16)-x(2)}" height="6" rx="3" fill="${C.sg}" opacity=".75"/><rect x="${x(19)}" y="${H-20}" width="${x(29)-x(19)}" height="6" rx="3" fill="${C.sg}" opacity=".75"/>
 ${line(so,'so')}${line(we,'we',5)}
 ${em.map(i=>`<circle cx="${x(i)}" cy="${y(so[i])-14}" r="6" fill="${C.em}"/><text x="${x(i)}" y="${y(so[i])-11}" text-anchor="middle" font-size="8" fill="#0e1420" font-weight="700">E</text>`).join('')}
 </svg><div class="legend" style="margin-top:6px"><span><i style="background:${C.so}"></i>Social views</span><span><i style="background:${C.we}"></i>Web users (×5)</span><span><i style="background:${C.em}"></i>Email sent</span><span><i style="background:${C.sg}"></i>Slide in rotation</span><span><i style="background:rgba(243,217,164,.5)"></i>Event</span></div>`}

const TAB={so:[['Fall Fitness Challenge kicks off Monday','Facebook · Oct 12','18.4k views','6.2% eng.'],['Kinser Triathlon: course map + packet pickup','Instagram · Oct 9','9.1k views','8.0% eng.'],['New spin studio at Foster Fitness','Facebook · Oct 21','6.7k views','4.9% eng.']],
 we:[['/fitness/classes','Class schedule','2,410 users','2:14 avg'],['/fitness/triathlon','Kinser Triathlon','1,380 users','1:52 avg'],['/fitness','Fitness home','990 users','0:48 avg']],
 em:[['November Fitness Lineup','Sent Oct 28 · 18,200 delivered','44% open','2.9% click'],['Triathlon: last call to register','Sent Oct 4 · 17,950 delivered','38% open','4.1% click']],
 sg:[['Fall Fitness Challenge','Rotating since Oct 2 · 28 days','14 screens','8s slot'],['Spin studio opening','Rotating since Oct 19 · 11 days','9 screens','8s slot']]};
let tab='so';
function detail(){const p=P[0];
 const items=TAB[tab].map(([t,s,m1,m2],i)=>`<div class="item"><div class="thumb" style="background:${C[tab]}">${{so:'POST',we:'PAGE',em:'EMAIL',sg:'SLIDE'}[tab]}</div><div><b>${t}</b><small>${s}</small></div><div class="m">${m1}<small class="mut">${m2}</small></div></div>`).join('');
 return topbar()+`<a class="back" href="#list" onclick="go('list');return false">${I.back}All programs</a>
 <div class="dhero"><div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap"><div><div class="mut" style="font-size:12px;letter-spacing:2px;text-transform:uppercase">${p.b} · Program</div><h1 style="font-family:var(--serif);font-weight:400;font-size:clamp(30px,3.4vw,42px);margin:6px 0 0">${p.n}</h1></div><span class="flag g">Strong across all four</span></div>
  <div class="big num">73.6k</div><div class="sub">blended reach in the last 30 days, <span class="up">up 21%</span> on the 30 before. Social views, web users and email opens added together as a trend line; slides counted separately as exposure.</div>
  <div style="margin-top:14px">${dots(p)}</div></div>
  <div class="chan4">
   <div class="ct"><div class="l"><i style="background:${C.so}"></i>Social</div><div class="v num">48.2k</div><div class="d"><span class="up">▲ 18%</span> <span class="mut">· 22 posts · 2 pages</span></div></div>
   <div class="ct"><div class="l"><i style="background:${C.we}"></i>Web</div><div class="v num">6,120</div><div class="d"><span class="up">▲ 34%</span> <span class="mut">· 3 paths</span></div></div>
   <div class="ct"><div class="l"><i style="background:${C.em}"></i>Email</div><div class="v num">19.3k</div><div class="d"><span class="mut">opens · 3 campaigns · 41% avg</span></div></div>
   <div class="ct"><div class="l"><i style="background:${C.sg}"></i>Signage</div><div class="v num">4</div><div class="d"><span class="mut">slides · 39 screen-days</span></div></div>
  </div></div>
 <div class="dgrid"><div style="display:flex;flex-direction:column;gap:16px">
  <div class="card"><h2>Every channel, day by day <small>last 30 days</small></h2>${chart()}</div>
  <div class="card"><h2>Connected content <small>sorted by performance</small></h2>
   <div class="tabs">${[['so','Posts',22],['we','Web pages',3],['em','Emails',3],['sg','Slides',4]].map(([k,l,n])=>`<button class="chip ${tab===k?'on':''}" onclick="tab='${k}';render()">${l} <span class="mut">${n}</span></button>`).join('')}</div>${items}
   <button class="btn" style="margin-top:12px">See all 22 posts</button></div></div>
  <div class="side">
   <div class="card"><h2>Gaps &amp; next moves</h2>
    <div class="gap"><span class="ic">${I.warn}</span><span><b>Kinser Triathlon has no slide yet.</b><br><span class="mut">It moved to a new date. Add a slide two weeks out.</span></span></div>
    <div class="gap"><span class="ic">${I.warn}</span><span><b>Instagram is quiet: 4 of 22 posts.</b><br><span class="mut">IG posts here average 2.1× the engagement of FB.</span></span></div>
    <div class="gap"><span class="ic ok">${I.ok}</span><span><b>The email ran the same week as posts.</b><br><span class="mut">Web users jumped 3× that day.</span></span></div></div>
   <div class="card"><h2>Events <small>linked in the sheet</small></h2>
    <div class="evrow"><span><b>Kinser Triathlon</b><br><small class="mut">Moved · new date pending</small></span><span class="flag w">No slide</span></div>
    <div class="evrow"><span><b>Fall Fitness Challenge</b><br><small class="mut">Oct 12 to Nov 9</small></span><span class="flag g">Live</span></div>
    <div class="evrow"><span><b>Turkey Trot 5K</b><br><small class="mut">Nov 26</small></span><span class="flag s">Upcoming</span></div></div>
   <div class="card"><h2>Where it lives</h2><div class="mut2" style="font-size:14px;line-height:1.7">2 Facebook pages · 1 Instagram account<br>3 web paths · 4 slides<br><span class="mut">Edit in the Programs tab of the Strategic Events sheet.</span></div></div>
  </div></div>`}

function render(){document.getElementById('app').innerHTML=view==='list'?list():detail();dock()}
function go(v){view=v==='list'?'list':v;location.hash=view;scrollTo(0,0);render()}
addEventListener('resize',dock);addEventListener('hashchange',()=>{view=location.hash.slice(1)||'list';render()});render();
</script>
</body>
</html>
